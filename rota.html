<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rota</title>
<style>
:root { --red:#D7261E; --red-deep:#A8150F; --red-soft:#FDECEA; --cream:#FBF6F0; --ink:#2A1A16; --muted:#9A8580; --line:#F1E7E2; --green:#2F8F4E; --green-soft:#E8F5EC; }
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif; background: var(--cream); color: var(--ink); padding-bottom: 32px; }

/* 顶栏 */
.topbar { position: sticky; top: 0; z-index: 100; background: linear-gradient(150deg, #E8342B 0%, var(--red) 55%, var(--red-deep) 100%); color: #fff; padding: 10px 14px; display: flex; align-items: center; gap: 10px; box-shadow: 0 4px 16px rgba(168,21,15,.18); }
.topbar .back { width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,.16); color: #fff; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
.topbar .mark { width: 30px; flex-shrink: 0; }
.topbar h1 { font-size: 16px; font-weight: 700; flex: 1; letter-spacing: .3px; }
.topbar h1 small { display: block; font-size: 10px; font-weight: 500; opacity: .8; letter-spacing: .5px; }
.pager { display: flex; align-items: center; gap: 6px; }
.pager-btn { width: 30px; height: 30px; border-radius: 50%; border: none; background: rgba(255,255,255,.16); color: #fff; font-size: 16px; line-height: 1; cursor: pointer; font-family: inherit; display: flex; align-items: center; justify-content: center; }
.pager-btn:disabled { opacity: .35; cursor: default; }
.pager-btn.active { background: #fff; color: var(--red); }
.pager-label { min-width: 104px; text-align: center; font-size: 13px; font-weight: 700; white-space: nowrap; }

/* 表格 */
.table-wrap { overflow: auto; -webkit-overflow-scrolling: touch; margin: 12px 12px 0; border-radius: 16px; background: #fff; box-shadow: 0 1px 10px rgba(42,26,22,.05); }
table { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; }
td.col-site, th.col-site { position: sticky; left: 0; z-index: 20; min-width: 86px; max-width: 86px; }
td.col-name, th.col-name { position: sticky; left: 86px; z-index: 20; min-width: 78px; max-width: 78px; }
thead tr th { position: sticky; z-index: 30; }
thead tr:first-child th { top: 0; }
thead tr:last-child th { top: 34px; }
.sum-table thead tr:first-child th, .sum-table thead tr:last-child th { top: 0; }
thead th.col-site, thead th.col-name { z-index: 40; }
thead tr:first-child th { background: #fff; color: var(--ink); font-size: 11px; font-weight: 700; text-align: center; padding: 8px 10px; height: 34px; white-space: nowrap; }
thead tr:last-child th { background: #fff; color: var(--muted); font-size: 10px; font-weight: 500; text-align: center; padding: 2px 10px 8px; height: 26px; border-bottom: 1px solid var(--line); }
thead th.th-today { background: var(--red-soft) !important; color: var(--red) !important; }
thead th.col-site-total { color: var(--red); }
tbody td { font-size: 11px; padding: 8px 10px; border-bottom: 1px solid #F7F0EC; text-align: center; white-space: nowrap; background: #fff; min-width: 104px; font-variant-numeric: tabular-nums; }
td.col-site { font-size: 11px; font-weight: 700; text-align: center; background: #fff; }
td.col-site.site-shoreditch  { color: #1D5FBF; background: #F1F6FE; }
td.col-site.site-battersea   { color: #C2620A; background: #FFF7EC; }
td.col-site.site-towerbridge { color: #2E7D32; background: #F0F8F0; }
td.col-site.site-piccadilly  { color: #00695C; background: #EEF8F6; }
td.col-site.site-brentcross  { color: var(--red); background: #FFF3F2; }
td.col-name { font-size: 12px; font-weight: 700; color: var(--ink); text-align: left; background: #fff; padding-left: 10px; }
td.day-cell { color: var(--ink); }
td.day-off { color: #CDBFBA; font-size: 10px; }
td.day-dash { color: #E5DAD6; }
td.day-today { background: #FFF6F5 !important; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 10px; font-weight: 600; }
.badge-shoreditch  { background: #E6EFFD; color: #1D5FBF; }
.badge-battersea   { background: #FFEFD9; color: #B85A06; }
.badge-towerbridge { background: #E1F3E3; color: #2E7D32; }
.badge-piccadilly  { background: #DDF1EE; color: #00695C; }
.badge-brentcross  { background: var(--red-soft); color: var(--red); }
td.col-ind-total, td.col-ind-total-empty { font-size: 12px; font-weight: 700; color: var(--ink); min-width: 52px; }
td.col-ind-total-empty { color: #E5DAD6; }
td.col-site-total { min-width: 78px; font-weight: 800; text-align: center; vertical-align: middle; color: var(--red); background: #FFFAF9; }
td.col-site-total-empty { min-width: 78px; background: #FFFAF9; }
tr.site-separator td { border-top: 6px solid var(--cream); }
.loading { padding: 40px; text-align: center; color: var(--muted); font-size: 13px; }
.error { padding: 40px; text-align: center; color: var(--red); font-size: 13px; }

/* 工时结算 */
.cards-section { padding: 22px 12px 8px; }
.sec-title { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 7px; margin: 0 4px 4px; }
.sec-title::before { content: ''; width: 3px; height: 15px; border-radius: 2px; background: var(--red); }
.sec-sub { font-size: 11px; color: var(--muted); margin: 0 4px 12px 14px; }
.site-sum { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 12px; padding-bottom: 2px; }
.site-pill { flex: 1 0 auto; background: #fff; border-radius: 12px; padding: 8px 12px; box-shadow: 0 1px 8px rgba(42,26,22,.04); min-width: 104px; }
.site-pill .k { font-size: 11px; font-weight: 700; display: flex; align-items: center; gap: 5px; }
.site-pill .v { font-size: 16px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
.site-pill .v small { font-size: 11px; font-weight: 500; color: var(--muted); margin-left: 2px; }
.site-pill.total { background: #FFF1EF; color: var(--red); }

.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.dot.shoreditch { background: #2F6FD6; } .dot.battersea { background: #E8862B; } .dot.brentcross { background: var(--red); } .dot.towerbridge { background: #43A047; } .dot.piccadilly { background: #00897B; } .dot.other { background: #C9B9B4; }

.cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 8px; }
.staff-card { background: #fff; border-radius: 14px; padding: 10px 12px 8px; box-shadow: 0 1px 10px rgba(42,26,22,.05); }
.sc-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.sc-name { font-size: 14px; font-weight: 700; }
.sc-sites { display: flex; gap: 3px; margin-top: 3px; flex-wrap: wrap; }
.sc-sites .badge { font-size: 9px; padding: 1px 6px; }
.sc-total { text-align: right; }
.sc-total .n { font-size: 15px; font-weight: 700; color: var(--ink); line-height: 1.2; font-variant-numeric: tabular-nums; }
.sc-total .u { font-size: 10px; color: var(--muted); margin-top: 1px; }

/* 计算式 */
.calc { display: flex; align-items: center; flex-wrap: nowrap; gap: 3px; margin-top: 8px; background: var(--cream); border-radius: 10px; padding: 4px; font-variant-numeric: tabular-nums; }
.calc .op { color: var(--muted); font-size: 11px; font-weight: 600; }
.calc .term { flex: 1 1 0; min-width: 0; display: inline-flex; flex-direction: column; align-items: center; line-height: 1.1; border-radius: 7px; padding: 3px 3px; background: #fff; }
.calc .term b { font-size: 12px; font-weight: 700; }
.calc .term i { font-style: normal; font-size: 9px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.calc .term.neg b { color: var(--red); } .calc .term.neg { background: #FFF1EF; }
.calc .term.pos b { color: var(--green); } .calc .term.pos { background: var(--green-soft); }
.calc .term.res { background: #FFF1EF; } .calc .term.res b { color: var(--red); } .calc .term.res i { color: #C98C86; }

/* 7 天条 */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 10px; }
.wd { border-radius: 10px; padding: 5px 0 6px; text-align: center; background: #FAF6F3; position: relative; cursor: default; }
.wd .d { font-size: 9px; color: var(--muted); }
.wd .h { font-size: 13px; font-weight: 800; margin-top: 2px; font-variant-numeric: tabular-nums; }
.wd .t { font-size: 8px; color: var(--muted); margin-top: 1px; white-space: nowrap; }
.wd.off .h { color: #D9CCC7; font-weight: 600; font-size: 11px; }
.wd.shoreditch { background: #EEF4FE; } .wd.shoreditch .h { color: #1D5FBF; }
.wd.battersea { background: #FFF4E6; } .wd.battersea .h { color: #B85A06; }
.wd.brentcross { background: #FFF0EE; } .wd.brentcross .h { color: var(--red); }
.wd.towerbridge { background: #EEF8EF; } .wd.towerbridge .h { color: #2E7D32; }
.wd.today { box-shadow: inset 0 0 0 1.5px var(--red); }
.wd .solo { position: absolute; top: 3px; right: 4px; width: 5px; height: 5px; border-radius: 50%; background: #E8862B; }
.wd .ol { position: absolute; top: 2px; right: 3px; font-size: 7px; color: var(--muted); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 10px; color: var(--muted); margin: 12px 6px 0; }
.legend span { display: inline-flex; align-items: center; gap: 4px; }

.adj { margin-top: 8px; }
.adj summary { list-style: none; cursor: pointer; font-size: 10px; color: var(--muted); padding: 4px 2px; }
.adj summary::-webkit-details-marker { display: none; }
.adj summary::after { content: ' ›'; }
.adj[open] summary::after { content: ' ⌄'; }
.adj-row { display: flex; justify-content: space-between; gap: 10px; font-size: 11px; padding: 4px 2px; border-top: 1px solid #F7F0EC; }
.adj-row span { color: #6B5A55; }
.adj-row b.neg { color: var(--red); } .adj-row b.pos { color: var(--green); }
.col-site .short { display: none; }
@media (max-width: 480px) {
  .topbar .mark, .topbar h1 small { display: none; } .pager-label { min-width: 92px; font-size: 12px; }
  .table-wrap { margin: 10px 8px 0; }
  td.col-site, th.col-site { min-width: 32px; max-width: 32px; padding-left: 2px; padding-right: 2px; font-size: 10px; }
  td.col-name, th.col-name { left: 32px; min-width: 62px; max-width: 62px; padding-left: 6px; font-size: 11px; overflow: hidden; text-overflow: ellipsis; }
  .col-site .full { display: none; } .col-site .short { display: inline; }
  thead th.col-site { font-size: 0; } 
  tbody td { min-width: 92px; padding: 7px 6px; }
}
.days { margin-top: 6px; }
.dr { display: grid; grid-template-columns: 62px 26px 1fr auto; align-items: center; gap: 6px; padding: 3px 6px; border-radius: 7px; font-size: 11px; font-variant-numeric: tabular-nums; }
.dr .dd { color: var(--muted); font-size: 11px; white-space: nowrap; }
.dr .dd b { color: var(--ink); font-weight: 700; margin-right: 2px; }
.dr .st { font-size: 9px; font-weight: 700; text-align: center; border-radius: 6px; padding: 2px 0; }
.dr .st.shoreditch { background: #E6EFFD; color: #1D5FBF; }
.dr .st.battersea { background: #FFEFD9; color: #B85A06; }
.dr .st.brentcross { background: var(--red-soft); color: var(--red); }
.dr .st.towerbridge { background: #E1F3E3; color: #2E7D32; }
.dr .st.other { background: var(--cream); color: var(--muted); }
.dr .tm { font-weight: 500; white-space: nowrap; }
.dr .hr { font-weight: 600; text-align: right; }
.dr .olt { font-size: 9px; color: var(--muted); margin-left: 5px; font-weight: 500; }
.dr.off .tm { color: #D3C5C0; font-weight: 500; font-size: 11px; }
.dr.off .dd b { color: #BCAEA9; }
.dr.today { background: #FFF3F1; }
.dr.today .dd b { color: var(--red); }
/* Σ 多周合计 */
.sum-wrap { padding: 4px 0 8px; }
.sum-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 12px 0 6px; padding: 0 4px; }
.sum-bar .sum-title { font-size: 15px; font-weight: 800; margin-right: 4px; }
.sum-bar select { padding: 7px 12px; border: none; border-radius: 999px; font-size: 12px; font-family: inherit; background: #fff; box-shadow: 0 1px 6px rgba(42,26,22,.06); color: var(--ink); cursor: pointer; }
.sum-section-title { font-size: 13px; font-weight: 800; margin: 18px 4px 8px; display: flex; align-items: center; gap: 6px; }
.sum-section-title::before { content: ''; width: 3px; height: 13px; border-radius: 2px; background: var(--red); }
.table-scroll { overflow-x: auto; border-radius: 14px; box-shadow: 0 1px 10px rgba(42,26,22,.05); }
.sum-table { width: 100%; border-collapse: collapse; background: #fff; font-size: 12px; font-variant-numeric: tabular-nums; }
.sum-table th { background: #fff; color: var(--muted); padding: 10px 12px; text-align: center; font-weight: 600; white-space: nowrap; border-bottom: 1px solid var(--line); }
.sum-table th:first-child { text-align: left; }
.sum-table td { padding: 9px 12px; text-align: center; border-bottom: 1px solid #F7F0EC; white-space: nowrap; }
.sum-table td:first-child { text-align: left; font-weight: 700; }
.sum-table tr:last-child td { border-bottom: none; }
.sum-table .sum-adj-neg { color: var(--red); font-weight: 700; }
.sum-table .sum-adj-pos { color: var(--green); font-weight: 700; }
.sum-table .sum-total { font-weight: 800; background: #FFF6F5; color: var(--red); }
#content.sum-mode { padding: 0 4px; }
</style>
</head>
<body>

<div class="topbar">
  <a class="back" href="/home" aria-label="Back">‹</a>
  <img class="mark" src="/assets/hi-mark-white.png" alt="">
  <h1>Rota<small>排班 · 工时</small></h1>
  <div class="pager">
    <button class="pager-btn" id="pg-prev" onclick="shiftWeek(-1)" disabled>‹</button>
    <div class="pager-label" id="pg-label">…</div>
    <button class="pager-btn" id="pg-next" onclick="shiftWeek(1)" disabled>›</button>
    <button class="pager-btn" id="btn-sum" onclick="toggleSummary()" title="多周合计" disabled>Σ</button>
  </div>
</div>

<div class="table-wrap">
  <div id="content" class="loading">Loading rota…</div>
</div>

<div id="cards-section" style="display:none;" class="cards-section">
  <div class="sec-title">Hours this week · 本周工时</div>
  <div class="sec-sub">Rota hours ± adjustments = hours paid · 排班工时 ± 奖惩 = 结算工时</div>
  <div id="site-sum" class="site-sum"></div>
  <div id="cards-grid" class="cards-grid"></div>
  <div class="legend"><span><i class="dot shoreditch"></i>Shoreditch</span><span><i class="dot brentcross"></i>Brent Cross</span><span><i class="dot battersea"></i>Battersea</span></div>
</div>

<script>
const SHEET_ID = '189O3dYKEwvR1zMxBs--eVM8VpK_w2AEV6IzUJ-JoAmc';
// 班表数据:单一 Rota tab,里面按「表头行(B列=Name) → 日期行 → 排班行」纵向堆叠多个周块。
// 优先用 gid(tab 的永久数字ID,改名/空格都不影响);gid = 点开 tab 后地址栏 #gid= 的数字。
const ROTA_GID = '1671572312';
// gid 失效时的兜底:按名字尝试
const ROTA_SHEET_CANDIDATES = ['Rota'];
let agencySet = new Set();
let allAdjustments = null;    // cached rows from 'Rota Adjustments' (whole ledger)
let currentWeekStart = null;  // ISO 'YYYY-MM-DD' Monday of the week being displayed

function pad2(n) { return n < 10 ? '0' + n : '' + n; }
function toISO(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }

// Monday of the current real-world week, offset by N weeks
function mondayOfToday(offsetWeeks) {
  const t = new Date();
  const dow = t.getDay(); // 0=Sun
  t.setDate(t.getDate() + (dow === 0 ? -6 : 1 - dow) + (offsetWeeks || 0) * 7);
  return toISO(t);
}

// 'YYYY-MM-DD' + n days -> Date
function addDaysISO(iso, n) {
  const p = iso.split('-').map(Number);
  return new Date(p[0], p[1] - 1, p[2] + (n || 0));
}
function fmtDDMM(iso, n) {
  const dt = addDaysISO(iso, n);
  return pad2(dt.getDate()) + '/' + pad2(dt.getMonth() + 1);
}

// Parse a sheet date string: '2026/07/06', '2026-07-06', '06/07/2026', '06/07' -> ISO or null
function parseSheetDate(s) {
  s = (s || '').trim();
  let m = s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/); // 年在前:2026/07/06 或 2026-07-06
  if (m) return m[1] + '-' + pad2(+m[2]) + '-' + pad2(+m[3]);
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (m) {
    let dd = +m[1], mm = +m[2];
    if (mm > 12 && dd <= 12) { const t = dd; dd = mm; mm = t; } // mm/dd 容错
    return m[3] + '-' + pad2(mm) + '-' + pad2(dd);
  }
  m = s.match(/^(\d{1,2})\/(\d{1,2})$/);
  if (m) return new Date().getFullYear() + '-' + pad2(+m[2]) + '-' + pad2(+m[1]);
  return null;
}

const DAY_NAMES = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

// ISO 'YYYY-MM-DD' → 'DD/MM';  以及 ISO + n 天
function ddmmFromISO(iso) {
  if (!iso) return null;
  const p = iso.split('-');
  return p.length === 3 ? `${p[2]}/${p[1]}` : null;
}
function isoAddDays(iso, n) {
  if (!iso) return null;
  const d = new Date(iso + 'T00:00:00');
  if (isNaN(d)) return null;
  d.setDate(d.getDate() + n);
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}

function getTodayColIdx(dayHeaders) {
  const today = new Date();
  const dow = today.getDay(); // 0=Sun,1=Mon,...,6=Sat
  const dayMap = { 1:'mon', 2:'tue', 3:'wed', 4:'thu', 5:'fri', 6:'sat', 0:'sun' };
  const todayKey = dayMap[dow];
  return dayHeaders.findIndex(h => {
    const hl = h.toLowerCase();
    return hl.startsWith(todayKey) || hl.includes(todayKey);
  });
}

async function fetchSheet(sheetName) {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('Failed to fetch sheet');
  const text = await res.text();
  return parseCSV(text);
}

function parseCSV(text) {
  const rows = [];
  let i = 0;
  while (i < text.length) {
    const cells = [];
    let cur = '';
    while (i < text.length) {
      if (text[i] === '"') {
        i++;
        while (i < text.length) {
          if (text[i] === '"') {
            if (text[i+1] === '"') { cur += '"'; i += 2; }
            else { i++; break; }
          } else {
            if (text[i] === '\n' || text[i] === '\r') cur += ' ';
            else cur += text[i];
            i++;
          }
        }
      } else if (text[i] === ',') {
        cells.push(cur.trim());
        cur = '';
        i++;
      } else if (text[i] === '\r') {
        i++;
      } else if (text[i] === '\n') {
        i++;
        break;
      } else {
        cur += text[i];
        i++;
      }
    }
    cells.push(cur.trim());
    if (cells.some(c => c)) rows.push(cells);
  }
  return rows;
}

async function fetchAgencyStaff() {
  try {
    const rows = await fetchSheet('Staff');
    const set = new Set();
    for (let i = 1; i < rows.length; i++) {
      const name = (rows[i][0] || '').trim();
      const type = (rows[i][1] || '').trim();
      if (type === 'Agency' && name) set.add(name);
    }
    return set;
  } catch(e) {
    return new Set();
  }
}

async function fetchAdjustments() {
  // Reads the "Rota Adjustments" tab: Name | Site | WeekStart | Hours | Note
  // Hours is signed: negative = deduction, positive = bonus.
  // WeekStart = Monday of the week the adjustment belongs to.
  // Backward compatible with the legacy 4-col layout (no WeekStart column).
  if (allAdjustments) return allAdjustments;
  try {
    const rows = await fetchSheet('Rota Adjustments');
    const header = (rows[0] || []).map(h => (h || '').toLowerCase());
    const hasWeek = !!(header[2] && header[2].indexOf('week') !== -1);
    const list = [];
    for (let i = 1; i < rows.length; i++) {
      const name  = (rows[i][0] || '').trim();
      const site  = (rows[i][1] || '').trim();
      const weekStart = hasWeek ? parseSheetDate(rows[i][2]) : null;
      const hoursRaw  = ((hasWeek ? rows[i][3] : rows[i][2]) || '').replace(/^=/, '').trim();
      const note      = ((hasWeek ? rows[i][4] : rows[i][3]) || '').trim();
      const hours = parseFloat(hoursRaw);
      if (name && !isNaN(hours) && hours !== 0) list.push({ name, site, weekStart, hours, note });
    }
    allAdjustments = list;
    return list;
  } catch(e) {
    return [];
  }
}

// Only adjustments belonging to the displayed week.
// Rows with no WeekStart (legacy) are shown on "This Week" only, so nothing silently disappears.
function adjustmentsForWeek(weekStart, includeUnattributed) {
  return (allAdjustments || []).filter(a =>
    a.weekStart === weekStart || (!a.weekStart && includeUnattributed));
}

function fmtSigned(n) {
  const v = Math.round(n * 100) / 100;
  return v > 0 ? `+${v}` : `${v}`;
}

function siteClass(site) {
  const s = (site || '').toLowerCase().replace(/\s/g, '');
  if (s.includes('shoreditch'))   return 'site-shoreditch';
  if (s.includes('battersea') || s.includes('nineelms') || s.includes('nineelm')) return 'site-battersea';
  if (s.includes('tower'))        return 'site-towerbridge';
  if (s.includes('piccadilly'))   return 'site-piccadilly';
  if (s.includes('brentcross') || s.includes('brent')) return 'site-brentcross';
  return '';
}

function badgeClass(val) {
  const v = (val || '').toLowerCase().replace(/\s/g, '');
  if (v.includes('shoreditch'))   return 'badge-shoreditch';
  if (v.includes('battersea'))    return 'badge-battersea';
  if (v.includes('tower'))        return 'badge-towerbridge';
  if (v.includes('piccadilly'))   return 'badge-piccadilly';
  if (v.includes('brentcross') || v.includes('brent')) return 'badge-brentcross';
  return '';
}

// Canonical English display name for a site (used on the per-day card badges)
function siteLabel(site) {
  switch (siteClass(site)) {
    case 'site-shoreditch':  return 'Shoreditch';
    case 'site-battersea':   return 'Battersea';
    case 'site-towerbridge': return 'Tower Bridge';
    case 'site-brentcross':  return 'BrentCross';
    case 'site-piccadilly':  return 'Piccadilly';
    default: return (site || '').split(/[\s,\(（]/)[0] || site;
  }
}

function renderCell(val, isToday) {
  const v = (val || '').trim();
  const vl = v.toLowerCase();
  const todayCls = isToday ? ' day-today' : '';

  if (!v || v === '-') {
    return `<td class="day-cell day-dash${todayCls}">–</td>`;
  }
  if (vl === 'off') {
    return `<td class="day-cell day-off${todayCls}">OFF</td>`;
  }
  if (vl.includes('shoreditch') || vl.includes('battersea') || vl.includes('tower') || vl.includes('piccadilly') || vl.includes('brent')) {
    const bc = badgeClass(v);
    return `<td class="day-cell${todayCls}"><span class="badge ${bc}">${v}</span></td>`;
  }
  return `<td class="day-cell${todayCls}">${v}</td>`;
}

function parseHours(val) {
  if (!val) return 0;
  const n = parseFloat(val.trim());
  return isNaN(n) ? 0 : n;
}

// 从排班格子里提取括号内小时数并求和,如 '1030-0100(13.5)'、'（8）'
// 与表内 SUMPRODUCT(REGEXEXTRACT(...)) 公式同一逻辑,用于总计列缺失/损坏时兜底
function hoursFromDays(days) {
  let sum = 0;
  (days || []).forEach(v => {
    const s = (v || '').toString();
    const re = /[\uff08(](\d+(?:\.\d+)?)[)\uff09]/g;
    let m;
    while ((m = re.exec(s)) !== null) sum += parseFloat(m[1]);
  });
  return Math.round(sum * 100) / 100;
}

// 单行工时:优先用表里的 Total Hours,取不到/为0 时从排班格自动计算
function rowHoursOf(row, totalHoursIdx, dayEndIdx) {
  const raw = totalHoursIdx > 0 ? parseHours(row[totalHoursIdx]) : 0;
  return raw || hoursFromDays(row.slice(2, dayEndIdx));
}

function buildTable(rows, agency, todayIdx, adjustments) {
  const allHeaders = rows[0];
  const totalHoursIdx = allHeaders.findIndex(h => h.toLowerCase().includes('total hours'));
  // Guard: if a legacy refund/deduction column still exists, keep it out of day cols
  const legacyIdx = allHeaders.findIndex(h => /refund|deduction/i.test(h));

  // Day cols: from col 2 up to (not including) total hours (or legacy column), max 7 days
  let dayEndIdx = totalHoursIdx > 0 ? totalHoursIdx : allHeaders.length;
  if (legacyIdx > 0 && legacyIdx < dayEndIdx) dayEndIdx = legacyIdx;
  if (dayEndIdx > 9) dayEndIdx = 9;

  const dayHeaders = allHeaders.slice(2, dayEndIdx);
  const dateRow    = rows[1].slice(2, dayEndIdx);

  // Build thead
  let thead = '<thead><tr>';
  thead += '<th class="col-site">Site</th>';
  thead += '<th class="col-name">Name</th>';
  dayHeaders.forEach((h, i) => {
    const cls = (i === todayIdx) ? ' th-today' : '';
    thead += `<th class="col-day${cls}">${h}</th>`;
  });
  thead += '</tr><tr>';
  thead += '<th class="col-site"></th>';
  thead += '<th class="col-name"></th>';
  dateRow.forEach((d, i) => {
    const cls = (i === todayIdx) ? ' th-today' : '';
    thead += `<th class="col-day${cls}">${d}</th>`;
  });
  thead += '</tr></thead>';

  // Group rows by site
  const dataRows = rows.slice(2).filter(r => r.some(c => c.trim()));
  const siteGroups = [];
  let curGroup = null;
  for (const row of dataRows) {
    const siteVal = (row[0] || '').trim();
    if (siteVal) {
      if (curGroup) siteGroups.push(curGroup);
      curGroup = { site: siteVal, rows: [row] };
    } else if (curGroup) {
      curGroup.rows.push(row);
    }
  }
  if (curGroup) siteGroups.push(curGroup);

  let tbody = '<tbody>';

  siteGroups.forEach((group, gi) => {
    const sc = siteClass(group.site);
    const siteDisplay = group.site.split(/[\s,\(（]/)[0].trim() || group.site;

    let siteTotal = 0;
    group.rows.forEach(row => {
      const name = (row[1] || '').trim();
      if (agency.has(name)) {
        siteTotal += rowHoursOf(row, totalHoursIdx, dayEndIdx);
      }
    });
    // Apply signed adjustments (deductions/bonuses) attributed to this site
    const groupSiteCls = siteClass(group.site);
    (adjustments || []).forEach(adj => {
      if (agency.has(adj.name) && groupSiteCls && siteClass(adj.site) === groupSiteCls) {
        siteTotal += adj.hours;
      }
    });
    siteTotal = Math.round(siteTotal * 100) / 100;
    const siteTotalDisplay = siteTotal > 0
      ? `<span style="font-size:18px">${siteTotal}</span><br><span style="font-size:9px;font-weight:500;color:#9A8580">hrs / week</span>`
      : '–';

    group.rows.forEach((row, ri) => {
      const isFirst = (ri === 0);
      const isSeparator = (gi > 0 && isFirst);
      const name = (row[1] || '').trim();
      const days = row.slice(2, dayEndIdx);
      let indHours = totalHoursIdx > 0 ? (row[totalHoursIdx] || '').trim() : '';
      if (!indHours || isNaN(parseFloat(indHours))) {
        const calc = hoursFromDays(days);
        indHours = calc > 0 ? String(calc) : '';
      }

      tbody += `<tr${isSeparator ? ' class="site-separator"' : ''}>`;
      if (isFirst) {
        const SHORT_SITE = { 'site-shoreditch': 'SD', 'site-brentcross': 'BC', 'site-battersea': 'BT', 'site-towerbridge': 'TB', 'site-piccadilly': 'PC' };
        tbody += `<td class="col-site ${sc}" rowspan="${group.rows.length}"><span class="full">${siteDisplay}</span><span class="short">${SHORT_SITE[sc] || siteDisplay.slice(0, 2)}</span></td>`;
      }
      tbody += `<td class="col-name">${name}</td>`;

      days.forEach((val, di) => {
        tbody += renderCell(val, di === todayIdx);
      });


      tbody += '</tr>';
    });
  });

  tbody += '</tbody>';
  return `<table>${thead}${tbody}</table>`;
}

function buildCards(rows, agency, dayHeaders, dayEndIdx, todayIdx, adjustments) {
  const allHeaders = rows[0];
  const totalHoursIdx = allHeaders.findIndex(h => h.toLowerCase().includes('total hours'));
  const dataRows = rows.slice(2).filter(r => r.some(c => c.trim()));
  const nDays = dayHeaders.length;

  const TIME_RE     = /[\uff08(]\s*\d+(?:\.\d+)?\s*[)\uff09]/;      // 含括号工时 → 真正上班的格子
  const TIME_RE_CAP = /[\uff08(](\d+(?:\.\d+)?)[)\uff09]/;          // 取括号里的数字
  const isOnline = v => /线上/.test(v || '');
  const isTime   = v => TIME_RE.test(v || '');
  const stripOnline = v => (v || '').replace(/线上/g, '').trim();

  // ── 1) 每天每站的“在店人数”:含正职,排除线上;交叉借调的 badge 不计(人算在他真正上班的站) ──
  // staffing[dayIdx] = { siteKey: Set(names) }
  const staffing = Array.from({ length: nDays }, () => ({}));
  {
    let curSite = '';
    for (const row of dataRows) {
      const s = (row[0] || '').trim(); if (s) curSite = s;
      const name = (row[1] || '').trim();
      if (!name) continue;
      const key = siteClass(curSite) || curSite;
      row.slice(2, dayEndIdx).forEach((v, i) => {
        const val = (v || '').trim();
        if (isTime(val) && !isOnline(val)) {
          (staffing[i][key] || (staffing[i][key] = new Set())).add(name);
        }
      });
    }
  }
  const headCount = (dayIdx, site) => {
    const key = siteClass(site) || site;
    const set = staffing[dayIdx] && staffing[dayIdx][key];
    return set ? set.size : 0;
  };

  // ── 2) 每位 agency 员工逐日的实际站点 / 时段 / 线上标记 ──
  const staffMap = new Map(); // name -> { days, daySite, dayOnline, rawOff, totalHours }
  {
    let curSite = '';
    for (const row of dataRows) {
      const s = (row[0] || '').trim(); if (s) curSite = s;
      const name = (row[1] || '').trim();
      if (!name || !agency.has(name)) continue;

      let rec = staffMap.get(name);
      if (!rec) {
        rec = {
          days:     new Array(nDays).fill(''),
          daySite:  new Array(nDays).fill(''),
          dayOnline:new Array(nDays).fill(false),
          rawOff:   new Array(nDays).fill(''),
          totalHours: 0
        };
        staffMap.set(name, rec);
      }
      rec.totalHours = Math.round((rec.totalHours + rowHoursOf(row, totalHoursIdx, dayEndIdx)) * 100) / 100;

      row.slice(2, dayEndIdx).forEach((v, i) => {
        const val = (v || '').trim();
        if (isTime(val)) {
          // 带工时的格子才决定站点(正常一天只有一处);记录站点与线上标记
          rec.days[i]      = val;
          rec.daySite[i]   = curSite;
          rec.dayOnline[i] = isOnline(val);
        } else if (val && !rec.days[i]) {
          // 非时段兜底:OFF / AL / – 之类;跨站 badge 跳过(不在卡片上显示指向)
          const vl = val.toLowerCase();
          const isBadge = vl.includes('shoreditch') || vl.includes('battersea') ||
                          vl.includes('tower') || vl.includes('piccadilly') || vl.includes('brent');
          if (!isBadge && !rec.rawOff[i]) rec.rawOff[i] = val;
        }
      });
    }
  }

  if (staffMap.size === 0) return;

  const grid = document.getElementById('cards-grid');
  grid.innerHTML = '';

  const dayLabels = dayHeaders.map((h, i) => {
    const fromSheet = parseSheetDate((rows[1] && rows[1][i + 2]) || '');
    const iso = fromSheet || isoAddDays(currentWeekStart, i);
    const dd = ddmmFromISO(iso);
    return { dow: (DAY_NAMES[i] || h.slice(0, 3)), date: dd || '' };
  });

  const adjMap = new Map();
  (adjustments || []).forEach(adj => {
    if (!adjMap.has(adj.name)) adjMap.set(adj.name, []);
    adjMap.get(adj.name).push(adj);
  });
  const r2 = n => Math.round(n * 100) / 100;
  const siteKeyOf = s => (siteClass(s) || 'other').replace('site-', '');

  // ── 站点合计(与上表 Site Hours 同一口径:按所在站点分组的排班工时 + 归属该站的调整) ──
  const siteTotals = new Map();
  {
    let curSite = '';
    for (const row of dataRows) {
      const s = (row[0] || '').trim(); if (s) curSite = s;
      const name = (row[1] || '').trim();
      if (!name || !agency.has(name)) continue;
      const k = siteLabel(curSite);
      siteTotals.set(k, (siteTotals.get(k) || 0) + rowHoursOf(row, totalHoursIdx, dayEndIdx));
    }
    (adjustments || []).forEach(a => {
      if (!agency.has(a.name)) return;
      const k = siteLabel(a.site);
      siteTotals.set(k, (siteTotals.get(k) || 0) + a.hours);
    });
  }
  let grand = 0; siteTotals.forEach(v => grand += v);
  document.getElementById('site-sum').innerHTML =
    `<div class="site-pill total"><div class="k">All sites 合计</div><div class="v">${r2(grand)}<small>hrs</small></div></div>` +
    [...siteTotals.entries()].map(([k, v]) =>
      `<div class="site-pill"><div class="k"><i class="dot ${siteKeyOf(k)}"></i>${k}</div><div class="v">${r2(v)}<small>hrs</small></div></div>`).join('');

  // ── 每人卡片:排班工时 ± 每条调整 = 结算工时 ──
  const cards = [...staffMap.entries()].map(([name, data]) => {
    const myAdjs = adjMap.get(name) || [];
    const adjSum = myAdjs.reduce((t, a) => t + a.hours, 0);
    const finalHours = r2(data.totalHours + adjSum);
    return { name, data, myAdjs, finalHours };
  }).sort((x, y) => y.finalHours - x.finalHours);

  cards.forEach(({ name, data, myAdjs, finalHours }) => {
    const sites = [...new Set(data.daySite.filter(Boolean).map(siteLabel))];
    const sitesHTML = sites.map(sl => `<span class="badge ${badgeClass(sl)}">${sl}</span>`).join('');

    // 计算式:排班 − 扣减合计 + 奖励合计 = 结算;明细收起在下方
    const ded = r2(myAdjs.filter(a => a.hours < 0).reduce((t, a) => t - a.hours, 0));
    const bon = r2(myAdjs.filter(a => a.hours > 0).reduce((t, a) => t + a.hours, 0));
    let calc = `<span class="term"><b>${r2(data.totalHours)}</b><i>Rota 排班</i></span>`;
    if (ded) calc += `<span class="op">−</span><span class="term neg"><b>${ded}</b><i>Deduct 扣减</i></span>`;
    if (bon) calc += `<span class="op">+</span><span class="term pos"><b>${bon}</b><i>Bonus 奖励</i></span>`;
    calc += `<span class="op">=</span><span class="term res"><b>${finalHours}</b><i>Paid 结算</i></span>`;
    const adjList = myAdjs.length ? `<details class="adj"><summary>Adjustments 奖惩明细 · ${myAdjs.length}</summary>${
      myAdjs.map(a => `<div class="adj-row"><span>${a.note || (a.hours < 0 ? 'Deduction' : 'Bonus')}</span><b class="${a.hours < 0 ? 'neg' : 'pos'}">${fmtSigned(a.hours)}</b></div>`).join('')
    }</details>` : '';

    // 每日明细:日期 | 站点 | 时段 | 工时
    const fmtRange = r => r.replace(/(\d{1,2})(\d{2})\s*-\s*(\d{1,2})(\d{2})/, (m, a, b, c, d) => `${a.padStart(2,'0')}:${b}–${c.padStart(2,'0')}:${d}`);
    const SHORT = { shoreditch: 'SD', brentcross: 'BC', battersea: 'BT', towerbridge: 'TB', piccadilly: 'PC' };
    const week = dayHeaders.map((h, i) => {
      const time = (data.days[i] || '').trim();
      const lab = dayLabels[i];
      const today = i === todayIdx ? ' today' : '';
      const dcell = `<span class="dd"><b>${lab.dow}</b> ${lab.date}</span>`;
      if (!time) {
        const off = (data.rawOff[i] || '').trim();
        const txt = (!off || off === '-') ? '–' : (off.toLowerCase() === 'off' ? 'OFF' : off);
        return `<div class="dr off${today}">${dcell}<span></span><span class="tm">${txt}</span><span></span></div>`;
      }
      const site = data.daySite[i];
      const key = siteKeyOf(site);
      const m = time.match(TIME_RE_CAP);
      const hrs = m ? parseFloat(m[1]) : '';
      const range = fmtRange(stripOnline(time).replace(/[（(]\d+(?:\.\d+)?[)）].*$/, '').trim());
      const online = data.dayOnline[i] ? '<span class="olt">online</span>' : '';
      return `<div class="dr${today}">${dcell}<span class="st ${key}">${SHORT[key] || siteLabel(site)}</span><span class="tm">${range}${online}</span><span class="hr">${hrs}h</span></div>`;
    }).join('');

    const card = document.createElement('div');
    card.className = 'staff-card';
    card.innerHTML = `
      <div class="sc-head">
        <div><div class="sc-name">${name}</div><div class="sc-sites">${sitesHTML}</div></div>
      </div>
      <div class="calc">${calc}</div>
      <div class="days">${week}</div>
      ${adjList}`;
    grid.appendChild(card);
  });

  document.getElementById('cards-section').style.display = 'block';
}

// ---------- 周翻页器:单一 Rota tab,里面纵向堆叠多个周块 ----------
// 块结构:表头行(B列='Name') → 日期行 → 排班行…。每个周块原样交给 buildTable / buildCards。
// 当某周的周一 = 今天所在周一时,自动加「今日高亮」并把未标注周次的调整计入当周。
let weekBlocks = null; // weekISO -> { rows }
let weekList = [];     // [{ iso } ...] 按日期升序
let weekIdx = -1;

async function fetchSheetByGid(gid) {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${gid}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('Failed to fetch sheet');
  return parseCSV(await res.text());
}

// 校验拿到的确实是班表数据(gviz 名字匹配不到时会悄悄返回第一个tab,必须验证)
function looksLikeRotaBlocks(rows) {
  return !!(rows && rows.length >= 3 && rows.some(r => ((r[1] || '').trim()) === 'Name'));
}

// 读取 Rota tab,把纵向堆叠的所有周块解析进 weekBlocks(weekISO -> { rows })
async function loadRotaBlocks() {
  let raw = null;
  try {
    const r = await fetchSheetByGid(ROTA_GID);
    if (looksLikeRotaBlocks(r)) raw = r;
  } catch(e) { /* gid 失败则按名字兜底 */ }
  if (!raw) {
    for (const name of ROTA_SHEET_CANDIDATES) {
      try {
        const r = await fetchSheet(name);
        if (looksLikeRotaBlocks(r)) { raw = r; break; }
      } catch(e) { /* 试下一个候选名 */ }
    }
  }
  weekBlocks = new Map();
  if (!raw) return;
  let r = 0;
  while (r < raw.length) {
    if (((raw[r][1] || '').trim()) !== 'Name') { r++; continue; }
    const headerRow = raw[r];
    const dateRow = raw[r + 1] || [];
    const weekISO = parseSheetDate(dateRow[2]);
    const dataRows = [];
    let i = r + 2;
    for (; i < raw.length; i++) {
      if (((raw[i][1] || '').trim()) === 'Name') break;
      if ((raw[i][1] || '').trim()) dataRows.push(raw[i]);
    }
    if (weekISO && dataRows.length) {
      weekBlocks.set(weekISO, { rows: [headerRow, dateRow].concat(dataRows) });
    }
    r = i;
  }
}

async function initWeeks() {
  await loadRotaBlocks();
  weekList = Array.from(weekBlocks.keys())
    .map(iso => ({ iso }))
    .sort((a, b) => a.iso < b.iso ? -1 : a.iso > b.iso ? 1 : 0);
  // 默认落点:包含今天的那一周;若今天这周还没有班表,则落在最新的一周
  const realMon = mondayOfToday(0);
  const i = weekList.findIndex(w => w.iso === realMon);
  weekIdx = i >= 0 ? i : weekList.length - 1;
  const b = document.getElementById('btn-sum');
  if (b) b.disabled = (weekList.length < 2);
  showWeek();
}

function shiftWeek(d) {
  const n = weekIdx + d;
  if (n < 0 || n >= weekList.length) return;
  weekIdx = n;
  document.getElementById('content').innerHTML = '<div class="loading">Loading\u2026</div>';
  document.getElementById('cards-section').style.display = 'none';
  showWeek();
}

function showWeek() {
  sumMode = false;
  const b = document.getElementById('btn-sum');
  if (b) b.classList.remove('active');
  updatePager();
  renderWeek(weekList[weekIdx].iso);
}

function updatePager() {
  if (weekIdx < 0) return;
  const iso = weekList[weekIdx].iso;
  document.getElementById('pg-label').textContent =
    fmtDDMM(iso, 0) + ' \u2013 ' + fmtDDMM(iso, 6);
  document.getElementById('pg-prev').disabled = (weekIdx <= 0);
  document.getElementById('pg-next').disabled = (weekIdx >= weekList.length - 1);
}

// 渲染某一周块。含今天的那周才高亮今日 + 未标注调整计入当周;其余周只显示已归属的调整。
async function renderWeek(weekISO) {
  const el = document.getElementById('content');
  if (agencySet.size === 0) agencySet = await fetchAgencyStaff();
  await fetchAdjustments();
  const block = weekBlocks && weekBlocks.get(weekISO);
  if (!block) {
    el.innerHTML = '<div class="error">No data for selected week</div>';
    return;
  }
  const rows = block.rows;
  currentWeekStart = weekISO;
  const isCurrentWeek = (weekISO === mondayOfToday(0));
  const adjustments = adjustmentsForWeek(weekISO, isCurrentWeek);

  const allHeaders = rows[0];
  const totalHoursIdx = allHeaders.findIndex(h => (h || '').toLowerCase().includes('total hours'));
  const legacyIdx = allHeaders.findIndex(h => /refund|deduction/i.test(h || ''));
  let dayEndIdx = totalHoursIdx > 0 ? totalHoursIdx : allHeaders.length;
  if (legacyIdx > 0 && legacyIdx < dayEndIdx) dayEndIdx = legacyIdx;
  if (dayEndIdx > 9) dayEndIdx = 9;
  const dayHeaders = allHeaders.slice(2, dayEndIdx);
  const todayIdx = isCurrentWeek ? getTodayColIdx(dayHeaders) : -1;

  el.className = '';
  el.innerHTML = buildTable(rows, agencySet, todayIdx, adjustments);
  buildCards(rows, agencySet, dayHeaders, dayEndIdx, todayIdx, adjustments);
  updatePager();
}

// ---------- 多周合计(Σ) ----------
let sumMode = false;

function toggleSummary() {
  if (sumMode) { showWeek(); return; }
  sumMode = true;
  document.getElementById('btn-sum').classList.add('active');
  document.getElementById('cards-section').style.display = 'none';
  // 默认区间:最近 4 周(含本周),不含下周;找不到本周就以最新一周为终点
  const realMon = mondayOfToday(0);
  let thisIdx = weekList.findIndex(w => w.iso === realMon);
  if (thisIdx < 0) thisIdx = weekList.length - 1;
  renderSummaryShell(Math.max(0, thisIdx - 3), thisIdx);
}

function renderSummaryShell(fromIdx, toIdx) {
  const el = document.getElementById('content');
  el.className = 'sum-mode';
  const opts = weekList.map((w, i) =>
    '<option value="' + i + '">' + fmtDDMM(w.iso, 0) + ' – ' + fmtDDMM(w.iso, 6) + '</option>').join('');
  el.innerHTML =
    '<div class="sum-bar"><span class="sum-title">多周合计</span>' +
    '<select id="sum-from" onchange="onSumRangeChange()">' + opts + '</select><span>→</span>' +
    '<select id="sum-to" onchange="onSumRangeChange()">' + opts + '</select></div>' +
    '<div id="sum-result"><div class="loading">Loading…</div></div>';
  document.getElementById('sum-from').value = fromIdx;
  document.getElementById('sum-to').value = toIdx;
  renderSummary(fromIdx, toIdx);
}

function onSumRangeChange() {
  let f = +document.getElementById('sum-from').value;
  let t = +document.getElementById('sum-to').value;
  if (f > t) { const x = f; f = t; t = x; }
  renderSummary(f, t);
}

function weekRowsFor(entry) {
  const b = weekBlocks && weekBlocks.get(entry.iso);
  return b ? b.rows : null;
}

// 从一周的 rows 算出每人/每站工时(仅 Agency 员工)
function statsFromRows(rows) {
  const allHeaders = rows[0];
  const totalHoursIdx = allHeaders.findIndex(h => (h || '').toLowerCase().includes('total hours'));
  const legacyIdx = allHeaders.findIndex(h => /refund|deduction/i.test(h || ''));
  let dayEndIdx = totalHoursIdx > 0 ? totalHoursIdx : allHeaders.length;
  if (legacyIdx > 0 && legacyIdx < dayEndIdx) dayEndIdx = legacyIdx;
  if (dayEndIdx > 9) dayEndIdx = 9;
  const perPerson = {}, perSite = {};
  let curSite = '';
  rows.slice(2).forEach(r => {
    const site = (r[0] || '').trim();
    if (site) curSite = site;
    const name = (r[1] || '').trim();
    if (!name || !agencySet.has(name)) return;
    const h = rowHoursOf(r, totalHoursIdx, dayEndIdx);
    if (h > 0) {
      perPerson[name] = (perPerson[name] || 0) + h;
      perSite[curSite] = (perSite[curSite] || 0) + h;
    }
  });
  return { perPerson, perSite };
}

function fmtH(n) {
  if (!n) return '–';
  return String(Math.round(n * 100) / 100);
}

async function renderSummary(fromIdx, toIdx) {
  const box = document.getElementById('sum-result');
  if (agencySet.size === 0) agencySet = await fetchAgencyStaff();
  await fetchAdjustments();

  const entries = weekList.slice(fromIdx, toIdx + 1);
  const weekStats = [];
  for (const e of entries) {
    const rows = await weekRowsFor(e);
    weekStats.push(rows ? statsFromRows(rows) : { perPerson: {}, perSite: {} });
  }

  // 区间内调整项(未填周的旧记录归到本周)
  const fromIso = entries[0].iso, toIso = entries[entries.length - 1].iso;
  const thisMon = mondayOfToday(0);
  const adjPerson = {}, adjSite = {};
  (allAdjustments || []).forEach(a => {
    const w = a.weekStart || thisMon;
    if (w >= fromIso && w <= toIso) {
      adjPerson[a.name] = (adjPerson[a.name] || 0) + a.hours;
      adjSite[a.site] = (adjSite[a.site] || 0) + a.hours;
    }
  });

  const weekCols = entries.map(e => fmtDDMM(e.iso, 0));

  function buildSumTable(firstCol, keys, getWeekVal, adjMap) {
    let h = '<div class="table-scroll"><table class="sum-table"><thead><tr><th>' + firstCol + '</th>' +
      weekCols.map(c => '<th>' + c + '</th>').join('') +
      '<th>Adj</th><th>Total</th></tr></thead><tbody>';
    keys.forEach(k => {
      let sum = 0;
      const cells = weekStats.map(ws => {
        const v = getWeekVal(ws, k) || 0;
        sum += v;
        return '<td>' + fmtH(v) + '</td>';
      }).join('');
      const adj = adjMap[k] || 0;
      const adjCls = adj < 0 ? 'sum-adj-neg' : (adj > 0 ? 'sum-adj-pos' : '');
      const adjTxt = adj ? (adj > 0 ? '+' : '') + fmtH0(adj) : '–';
      h += '<tr><td>' + k + '</td>' + cells +
        '<td class="' + adjCls + '">' + adjTxt + '</td>' +
        '<td class="sum-total">' + fmtH(sum + adj) + '</td></tr>';
    });
    h += '</tbody></table></div>';
    return h;
  }
  function fmtH0(n) { return String(Math.round(n * 100) / 100); }

  // 站点:按出现顺序;员工:按合计降序
  const siteKeys = [];
  weekStats.forEach(ws => Object.keys(ws.perSite).forEach(s => { if (!siteKeys.includes(s)) siteKeys.push(s); }));
  Object.keys(adjSite).forEach(s => { if (s && !siteKeys.includes(s)) siteKeys.push(s); });

  const personTotals = {};
  weekStats.forEach(ws => Object.keys(ws.perPerson).forEach(n => {
    personTotals[n] = (personTotals[n] || 0) + ws.perPerson[n];
  }));
  Object.keys(adjPerson).forEach(n => { personTotals[n] = (personTotals[n] || 0) + 0; });
  const personKeys = Object.keys(personTotals).sort((a, b) => (personTotals[b] || 0) - (personTotals[a] || 0));

  const nWeeks = entries.length;
  box.innerHTML =
    '<div class="sum-section-title">Site hours · ' + nWeeks + ' week' + (nWeeks > 1 ? 's' : '') + '</div>' +
    buildSumTable('Site', siteKeys, (ws, k) => ws.perSite[k], adjSite) +
    '<div class="sum-section-title">Staff hours · ' + nWeeks + ' week' + (nWeeks > 1 ? 's' : '') + '</div>' +
    buildSumTable('Name', personKeys, (ws, k) => ws.perPerson[k], adjPerson);
}

initWeeks();
</script>
