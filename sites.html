<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sites</title>
<link rel="stylesheet" href="/assets/hdl.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-size: 14px; }
.site-card { background: #fff; border-radius: 16px; box-shadow: var(--shadow); margin-bottom: 10px; overflow: hidden; }
.site-header { padding: 14px 14px 10px; display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.site-name { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.site-name svg { color: var(--red); }
.site-addr { font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.4; }
.active-badge { font-size: 11px; padding: 4px 10px; border-radius: 999px; background: var(--red-soft); color: var(--red); font-weight: 600; white-space: nowrap; }
.site-body { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; padding: 0 10px 10px; }
.sec { padding: 10px 12px; background: var(--cream); border-radius: 12px; }
.sec-label { font-size: 11px; color: var(--muted); font-weight: 600; margin-bottom: 6px; }
.wifi-name { font-size: 13px; font-weight: 700; }
.wifi-pass { font-size: 12px; color: #6B5A55; margin-top: 3px; font-variant-numeric: tabular-nums; }
.code-row { font-size: 12px; color: #6B5A55; margin-bottom: 4px; display: flex; justify-content: space-between; gap: 8px; }
.code-val { font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
.hours-row { display: flex; justify-content: space-between; font-size: 12px; color: #6B5A55; margin-bottom: 4px; }
.hours-row b { color: var(--ink); font-weight: 600; }
.hours-total { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--red); border-top: 1px solid var(--line); padding-top: 6px; margin-top: 4px; }
.loading { text-align: center; padding: 60px; color: var(--muted); }
@media (max-width: 560px) { .site-body { grid-template-columns: 1fr; } }
</style>

</head>
<body>
<div class="hdl-bar">
  <a class="hdl-back" href="/home" aria-label="Back">‹</a>
  <img class="hdl-mark" src="/assets/hi-mark-white.png" alt="">
  <div class="hdl-title">Sites<small id="subtitle">站点信息</small></div>
</div>
<div class="hdl-wrap">
  <div id="content"><div class="loading">Loading...</div></div>
</div>
<script src="/assets/hdl-icons.js"></script>
<script>
const SHEET_ID = '189O3dYKEwvR1zMxBs--eVM8VpK_w2AEV6IzUJ-JoAmc';

async function fetchSites() {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Sites`;
  const res = await fetch(url);
  const text = await res.text();
  const json = JSON.parse(text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/)[1]);
  return json.table.rows.map(r => ({
    site: r.c[0]?.v || '',
    address: r.c[1]?.v || '',
    wifiName: r.c[2]?.v || '',
    wifiPass: r.c[3]?.v || '',
    codes: r.c[4]?.v || '',
    open: r.c[5]?.v || '',
    close: r.c[6]?.v || '',
    prep: r.c[7]?.v || '',
    closing: r.c[8]?.v || '',
    break: r.c[9]?.v || '',
    active: r.c[10]?.v || '',
    show: r.c[11]?.v,
  })).filter(s => !/^(no|false|0)$/i.test(String(s.show ?? '').trim()));  // Sites sheet col L "Show" = No hides a site; data stays
}

function formatTime(raw) {
  if (!raw) return '';
  if (typeof raw === 'string' && raw.startsWith('Date(')) {
    const p = raw.replace('Date(','').replace(')','').split(',');
    return `${String(parseInt(p[3]||0)).padStart(2,'0')}:${String(parseInt(p[4]||0)).padStart(2,'0')}`;
  }
  return String(raw).slice(0,5);
}

function parseCodes(raw) {
  return raw.split('|').map(s => s.trim()).filter(Boolean).map(s => {
    const idx = s.indexOf(':');
    if (idx === -1) return `<div class="code-row"><span>${s}</span></div>`;
    const label = s.slice(0, idx).trim();
    const val = s.slice(idx+1).trim();
    return `<div class="code-row"><span>${label}</span><span class="code-val">${val}</span></div>`;
  }).join('');
}

function render(sites) {
  document.getElementById('content').innerHTML = sites.map(s => `
    <div class="site-card">
      <div class="site-header">
        <div>
          <div class="site-name">${HDL_ICON('pin', 16)}${s.site}</div>
          <div class="site-addr">${s.address}</div>
        </div>
        <div class="active-badge">${s.active}h active</div>
      </div>
      <div class="site-body">
        <div class="sec">
          <div class="sec-label">WiFi</div>
          <div class="wifi-name">${s.wifiName}</div>
          <div class="wifi-pass">${s.wifiPass}</div>
        </div>
        <div class="sec">
          <div class="sec-label">Codes</div>
          ${parseCodes(s.codes)}
        </div>
        <div class="sec">
          <div class="sec-label">Hours</div>
          <div class="hours-row"><span>Store open</span><b>${formatTime(s.open)} – ${formatTime(s.close)}</b></div>
          <div class="hours-row"><span>Opening prep</span><b>${s.prep}h</b></div>
          <div class="hours-row"><span>Closing</span><b>${s.closing}h</b></div>
          <div class="hours-row"><span>Staff break</span><b>${s.break}h</b></div>
          <div class="hours-total"><span>Active service</span><span>${s.active}h</span></div>
        </div>
      </div>
    </div>
  `).join('');
  document.getElementById('subtitle').textContent = `站点信息 · ${sites.length} sites`;
}

async function init() {
  try { render(await fetchSites()); }
  catch(e) { document.getElementById('content').innerHTML = `<div class="loading" style="color:#c62828;">Failed: ${e.message}</div>`; }
}
init();
</script>
</body>
</html>
