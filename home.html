<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Haidilao Mini Hot Pot</title>
<meta name="theme-color" content="#D7261E">
<style>
:root { --red:#D7261E; --red-deep:#A8150F; --red-soft:#FDECEA; --cream:#FBF6F0; --ink:#2A1A16; --muted:#9A8580; --line:#F4EBE6; }
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif; background: var(--cream); color: var(--ink); min-height: 100vh; padding-bottom: 32px; }
.hero { background: linear-gradient(150deg, #E8342B 0%, var(--red) 50%, var(--red-deep) 100%); color: #fff; padding: 18px 16px 44px; border-radius: 0 0 24px 24px; position: relative; overflow: hidden; }
.hero::after { content: ''; position: absolute; width: 200px; height: 200px; border-radius: 50%; background: rgba(255,255,255,.07); right: -60px; top: -90px; }
.hero-inner { max-width: 480px; margin: 0 auto; display: flex; align-items: center; gap: 12px; position: relative; z-index: 1; }
.hero img { width: 44px; flex-shrink: 0; }
.hero h1 { font-size: 19px; font-weight: 700; letter-spacing: .3px; }
.hero p { font-size: 11px; opacity: .8; margin-top: 2px; letter-spacing: .5px; }
.container { max-width: 480px; margin: -28px auto 0; padding: 0 12px; position: relative; z-index: 2; }
.section { margin-bottom: 18px; }
.section-label { font-size: 13px; font-weight: 700; color: var(--ink); margin: 0 4px 8px; display: flex; align-items: center; gap: 6px; }
.section-label::before { content: ''; width: 3px; height: 13px; border-radius: 2px; background: var(--red); }
.nav-list { background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 1px 8px rgba(42,26,22,.04); }
.nav-item, .nav-item-disabled { display: flex; align-items: center; justify-content: space-between; padding: 11px 14px; text-decoration: none; color: var(--ink); position: relative; }
.nav-item + .nav-item::before, .nav-item + .nav-item-disabled::before, .nav-item-disabled + .nav-item::before, .nav-item-disabled + .nav-item-disabled::before { content: ''; position: absolute; top: 0; left: 60px; right: 14px; height: 1px; background: var(--line); }
.nav-item:active { background: var(--cream); }
.nav-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
.nav-icon { width: 34px; height: 34px; border-radius: 10px; background: var(--cream); display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; }
.nav-text { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.nav-name { font-size: 14px; font-weight: 600; }
.nav-desc { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav-arrow { font-size: 20px; color: #D9C9C4; flex-shrink: 0; }
.nav-item-disabled { cursor: default; }
.nav-item-disabled .nav-icon { opacity: .4; }
.nav-item-disabled .nav-name, .nav-item-disabled .nav-desc { color: #C9B9B4; }
.coming-soon-tag { font-size: 10px; color: var(--muted); background: var(--cream); border-radius: 999px; padding: 3px 8px; white-space: nowrap; }
.loading { text-align: center; padding: 40px; color: var(--muted); font-size: 13px; background: #fff; border-radius: 16px; }
.chip-list { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: #fff; border-radius: 999px; padding: 7px 12px; text-decoration: none; font-size: 12px; color: var(--ink); box-shadow: 0 1px 6px rgba(42,26,22,.04); }
.chip:active { background: var(--red-soft); }
.chip .chip-out { color: var(--red); font-size: 11px; font-weight: 700; }
.nav-list.pinned { background: linear-gradient(135deg, #fff 0%, #FFF4F2 100%); box-shadow: 0 6px 20px rgba(168,21,15,.12); }
.nav-list.pinned .nav-icon { background: var(--red-soft); }
.nav-list.pinned .nav-arrow { color: var(--red); }
/* 海底捞 App 金刚区式宫格 */
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile { background: #fff; border-radius: 14px; padding: 12px; text-decoration: none; color: var(--ink); display: flex; align-items: center; gap: 10px; min-width: 0; position: relative; box-shadow: 0 1px 6px rgba(42,26,22,.04); transition: transform .12s; }
.tile:active { transform: scale(.97); background: #FFF8F6; }
.tile .ic { width: 36px; height: 36px; border-radius: 11px; background: var(--red-soft); color: var(--red); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
.tile .tx { min-width: 0; }
.tile .nm { font-size: 13px; font-weight: 700; line-height: 1.25; }
.tile .ds { font-size: 11px; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile.off { opacity: .45; }
.tile.off .soon { position: absolute; top: 6px; right: 8px; font-size: 9px; color: var(--muted); }
.banner { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-radius: 16px; text-decoration: none; color: #fff; background: linear-gradient(120deg, #F0483D 0%, var(--red) 55%, #B81A12 100%); box-shadow: 0 8px 22px rgba(168,21,15,.22); position: relative; overflow: hidden; margin-bottom: 8px; }
.banner::after { content: ''; position: absolute; width: 120px; height: 120px; border-radius: 50%; background: rgba(255,255,255,.08); right: -30px; bottom: -50px; }
.banner .ic { width: 40px; height: 40px; border-radius: 13px; background: rgba(255,255,255,.95); color: var(--red); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
.banner .nm { font-size: 16px; font-weight: 700; }
.banner .ds { font-size: 12px; opacity: .85; margin-top: 2px; }
.banner .go { margin-left: auto; background: #fff; color: var(--red); font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 999px; position: relative; z-index: 1; white-space: nowrap; }
.foot { text-align: center; margin-top: 22px; }
.foot img { width: 116px; opacity: .85; }
</style>
</head>
<body>
<header class="hero">
  <div class="hero-inner">
    <img src="/assets/hi-mark-white.png" alt="Haidilao">
    <div>
      <h1>Haidilao Mini Hot Pot</h1>
      <p>STAFF DASHBOARD</p>
    </div>
  </div>
</header>
<div class="container">
  <div id="content"><div class="loading">Loading...</div></div>
  <div class="foot"><img src="/assets/haidilao-logo-h-red.png" alt="海底捞火锅"></div>
</div>
<script src="/assets/hdl-icons.js"></script>
<script>
const SHEET_ID = '189O3dYKEwvR1zMxBs--eVM8VpK_w2AEV6IzUJ-JoAmc';
// Categories shown first on the page, with the highlighted (yellow) card style.
const PINNED = ['Kitchen SOP'];

async function fetchNav() {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Nav&headers=1`;
  const res = await fetch(url);
  const text = await res.text();
  const json = JSON.parse(text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/)[1]);
  return json.table.rows.map(r => ({
    category: r.c[0]?.v || '',
    name: r.c[1]?.v || '',
    description: r.c[2]?.v || '',
    url: r.c[3]?.v || '',
    icon: r.c[4]?.v || '',
  }));
}

function render(items) {
  const byCategory = {};
  items.forEach(item => {
    if (!byCategory[item.category]) byCategory[item.category] = [];
    byCategory[item.category].push(item);
  });
  const entries = Object.entries(byCategory).sort(([a], [b]) => (PINNED.includes(b) ? 1 : 0) - (PINNED.includes(a) ? 1 : 0));
  document.getElementById('content').innerHTML = entries.map(([cat, items]) => {
    const isChipSection = items.every(it => it.url.startsWith('http'));
    if (isChipSection) return `
    <div class="section">
      <div class="section-label">${cat}</div>
      <div class="chip-list">
        ${items.map(item => `
          <a class="chip" href="${item.url}" target="_blank" rel="noopener">
            <span>${item.name}${item.description ? ' ' + item.description : ''}</span>
            <span class="chip-out">&#8599;</span>
          </a>
        `).join('')}
      </div>
    </div>`;
    const icon = it => HDL_ICON(it.name + ' ' + it.description, 19);
    const ext = it => it.url.startsWith('http') ? ' target="_blank" rel="noopener"' : '';
    if (PINNED.includes(cat)) return `
    <div class="section" style="padding-top:6px">
      ${items.map(it => `
        <a class="banner" href="${it.url}"${ext(it)}>
          <div class="ic">${icon(it)}</div>
          <div><div class="nm">${it.name}</div><div class="ds">${it.description}</div></div>
          <span class="go">进入 ›</span>
        </a>`).join('')}
    </div>`;
    return `
    <div class="section">
      <div class="section-label">${cat}</div>
      <div class="grid">
        ${items.map(it => it.url === '/coming-soon' ? `
          <div class="tile off"><span class="soon">Soon</span><div class="ic">${icon(it)}</div><div class="tx"><div class="nm">${it.name}</div><div class="ds">${it.description}</div></div></div>
        ` : `
          <a class="tile" href="${it.url}"${ext(it)}><div class="ic">${icon(it)}</div><div class="tx"><div class="nm">${it.name}</div><div class="ds">${it.description}</div></div></a>
        `).join('')}
      </div>
    </div>
  `;}).join('');
}

async function init() {
  try { render(await fetchNav()); }
  catch(e) { document.getElementById('content').innerHTML = `<div class="loading">Failed: ${e.message}</div>`; }
}
init();
</script>
</body>
</html>
