<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kitchen SOP</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f5f5f5; color: #1a1a1a; }
.container { max-width: 480px; margin: 0 auto; padding: 24px 16px 60px; }
.back { display: inline-block; font-size: 14px; color: #1F3864; text-decoration: none; margin-bottom: 18px; }
.header { margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid #efefef; }
.header h1 { font-size: 20px; font-weight: 600; }
.header p { font-size: 13px; color: #aaa; margin-top: 4px; }
.nav-list { background: white; border-radius: 16px; border: 1px solid #efefef; overflow: hidden; }
.nav-item { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-bottom: 1px solid #f5f5f5; text-decoration: none; color: #1a1a1a; }
.nav-item:last-child { border-bottom: none; }
.nav-icon { width: 36px; height: 36px; border-radius: 9px; background: #f5f5f5; display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; }
.nav-text { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.nav-name { font-size: 14px; font-weight: 500; }
.nav-desc { font-size: 12px; color: #aaa; }
.nav-arrow { font-size: 20px; color: #ccc; }
.nav-out { font-size: 14px; color: #bbb; }
.section { margin-bottom: 24px; }
.section-label { font-size: 10px; color: #aaa; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; padding: 0 2px; }
</style>
</head>
<body>
<div class="container">
  <a href="/home" class="back">‹ Back</a>
  <div class="header">
    <h1>Kitchen SOP</h1>
    <p>出品 · 收货</p>
  </div>
  <div id="list"></div>
</div>
<script>
/* SOP groups in display order. External links (Drive folders) open in a new tab. */
const GROUPS = [
  { label: 'Menu Preparation 出品指南', items: [
    { en: 'Soup Base Guide', zh: '汤底制作指南 · PDF', url: '/soup-base-guide', icon: '🍲' },
    { en: 'Menu Preparation Guide (with pic)', zh: '出品指南图文版 · 文件夹', url: 'https://drive.google.com/drive/folders/1Gn8G6TPQ9UcSiSpEpdOu-49O6FmGtjEm', icon: '🖼️' },
  ]},
  { label: 'Receiving 收货', items: [
    { en: 'Receiving Standard', zh: '收货拍照标准 · PDF', url: '/receiving-standard', icon: '📋' },
    { en: 'Receiving Upload', zh: '收货照片上传', url: '/receiving.html', icon: '📷' },
    { en: 'Stock Receiving Standards (photos)', zh: '收货标准示例照片 · 文件夹', url: 'https://drive.google.com/drive/folders/1OXpvhSQdW94HqxluqbIxcBpQUVzKwhUv', icon: '📁' },
  ]},
];
const ext = u => u.startsWith('http');
document.getElementById('list').innerHTML = GROUPS.map(g => `
  <div class="section">
    <div class="section-label">${g.label}</div>
    <div class="nav-list">${g.items.map(i => `
      <a class="nav-item" href="${i.url}"${ext(i.url) ? ' target="_blank" rel="noopener"' : ''}>
        <div class="nav-icon">${i.icon}</div>
        <div class="nav-text"><div class="nav-name">${i.en}</div><div class="nav-desc">${i.zh}</div></div>
        ${ext(i.url) ? '<div class="nav-out">↗</div>' : '<div class="nav-arrow">›</div>'}
      </a>`).join('')}
    </div>
  </div>`).join('');
</script>
</body>
</html>
