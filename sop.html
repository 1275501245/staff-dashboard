<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kitchen SOP</title>
<link rel="stylesheet" href="/assets/hdl.css">
<style>* { box-sizing: border-box; margin: 0; padding: 0; }</style>

</head>
<body>
<div class="hdl-bar">
  <a class="hdl-back" href="/home" aria-label="Back">‹</a>
  <img class="hdl-mark" src="/assets/hi-mark-white.png" alt="">
  <div class="hdl-title">Kitchen SOP<small>出品 · 收货</small></div>
</div>
<div class="hdl-wrap"><div id="list"></div></div>
<script src="/assets/hdl-icons.js"></script>
<script>
/* SOP groups in display order. External links (Drive folders) open in a new tab. */
const GROUPS = [
  { label: 'Menu Preparation 出品指南', items: [
    { en: 'Soup Base Guide', zh: '汤底制作指南 · PDF', url: '/soup-base-guide', icon: 'pot' },
    { en: 'Menu Preparation Guide (with pic)', zh: '出品指南图文版 · 文件夹', url: 'https://drive.google.com/drive/folders/1Gn8G6TPQ9UcSiSpEpdOu-49O6FmGtjEm', icon: 'image' },
  ]},
  { label: 'Receiving 收货', items: [
    { en: 'Receiving Standard', zh: '收货拍照标准 · PDF', url: '/receiving-standard', icon: 'file' },
    { en: 'Receiving Upload', zh: '收货照片上传', url: '/receiving.html', icon: 'camera' },
  ]},
];
const ext = u => u.startsWith('http');
document.getElementById('list').innerHTML = GROUPS.map(g => `
  <div class="hdl-sec">${g.label}</div>
  <div class="hdl-grid">${g.items.map(i => `
    <a class="hdl-tile" href="${i.url}"${ext(i.url) ? ' target="_blank" rel="noopener"' : ''}>
      <div class="hdl-ic">${HDL_ICON(i.icon, 19)}</div>
      <div class="tx"><div class="nm">${i.en}</div><div class="ds">${i.zh}</div></div>
      ${ext(i.url) ? '<span class="out">↗</span>' : ''}
    </a>`).join('')}
  </div>`).join('');
</script>
</body>
</html>
