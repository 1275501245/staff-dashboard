<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title></title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF0F2; --paper:#FFFFFF; --ink:#1A1D21; --ink2:#5B626B; --ink3:#8E959E; --line:#E4E7EA; --mute:#CDD2D8;
  --brand:#B8121B; --dr:#00A99D; --hp:#E0A000;
  --up:#1F8A5B; --down:#C23B2E; --warn:#E08A00;
  --num:"Barlow","Noto Sans SC",system-ui,sans-serif;
  --txt:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--txt);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:820px;margin:0 auto;padding:16px 14px 40px}
svg{display:block;width:100%;height:auto;overflow:visible}
svg text{font-family:var(--num)}

.card{background:var(--paper);border-radius:14px;padding:16px 20px 18px;margin-top:12px}
h2{font-size:15px;font-weight:700;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
h2 .note{font-size:12px;font-weight:400;color:var(--ink3)}

/* header */
.head{background:var(--paper);border-radius:14px;padding:16px 20px;border-top:6px solid var(--brand);display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.kicker{font-size:13px;color:var(--ink2);margin:0}
.date{font-family:var(--num);font-weight:700;font-size:40px;line-height:1.05;margin:2px 0 0}
.date small{font-family:var(--txt);font-weight:500;font-size:17px;color:var(--ink2);margin-left:8px}
select{font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
select:focus-visible,button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:12px}
.kpi{background:var(--paper);border-radius:14px;padding:14px 16px 10px;display:flex;flex-direction:column}
.kpi .l{font-size:13px;color:var(--ink2)}
.kpi .v{font-family:var(--num);font-weight:700;font-size:30px;line-height:1.1;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .v.neg{color:var(--down)}
.kpi .spark{margin-top:auto;padding-top:10px}
.kpi .cmpnote{font-size:12px;color:var(--ink3);margin-left:6px}
.sp-axis{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--ink3);font-family:var(--num);margin-top:3px;gap:6px}
.sp-axis .lg{display:flex;gap:8px;align-items:center;font-family:var(--txt)}
.sp-axis i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:3px;vertical-align:0}
.sp-axis i.o{border:1.5px solid currentColor;background:var(--paper)}
.sp-axis i.f{background:currentColor}
.chip{display:inline-block;font-family:var(--num);font-size:12.5px;font-weight:600;padding:1px 7px;border-radius:10px;margin-top:4px;white-space:nowrap}
.chip.up{color:var(--up);background:#E6F4EC}.chip.down{color:var(--down);background:#FBE9E7}.chip.flat{color:var(--ink3);background:#F1F2F4}

/* month */
.month{display:grid;grid-template-columns:170px 1fr;gap:20px;align-items:center}
.ringbox{text-align:center}
.ringbox .cap{font-size:12px;color:var(--ink2);margin-top:4px;line-height:1.4}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.legend i.line{height:0;border-top:2px dashed var(--brand);border-radius:0;vertical-align:3px}

/* station bars */
.srow{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:8px 0}
.srow + .srow{border-top:1px solid var(--line)}
.srow .name{font-weight:700;font-size:16px}
.srow .tot{text-align:right;font-family:var(--num);font-weight:700;font-size:18px;min-width:84px}
.srow .tot .chip{display:block;width:max-content;margin-left:auto}
.seg{display:flex;height:26px;border-radius:6px;overflow:hidden;background:#F1F2F4}
.seg div{height:100%}
.seg .dr{background:var(--dr)}.seg .hp{background:var(--hp)}
.sub{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin-top:5px;font-family:var(--num)}
.sub b{color:var(--ink);font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.dot.dr{background:var(--dr)}.dot.hp{background:var(--hp)}

/* toggle */
.tog{display:inline-flex;background:#F1F2F4;border-radius:8px;padding:2px}
.tog button{font:inherit;font-size:12.5px;border:0;background:transparent;padding:3px 12px;border-radius:6px;color:var(--ink2);cursor:pointer}
.tog button[aria-pressed="true"]{background:var(--paper);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(26,29,33,.12)}

.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two .card{margin-top:0}
.grid-gap{margin-top:12px}
.stat{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.stat .big{font-family:var(--num);font-weight:700;font-size:28px}
.stat .u{font-size:12px;color:var(--ink3)}
.minor{font-size:12.5px;color:var(--ink2);font-family:var(--num)}
.lab-st{padding:4px 0 10px}
.lab-st + .lab-st{border-top:1px solid var(--line);padding-top:12px}
.lab-st h3{margin:0;font-size:13px;color:var(--ink2);font-weight:500}

.cmp{display:flex;gap:18px;margin-top:10px;font-size:13px;color:var(--ink2);align-items:center;flex-wrap:wrap}
.cmp b{font-family:var(--num);font-size:20px;color:var(--ink);margin-left:6px}

.hb{display:grid;grid-template-columns:118px 1fr 50px;gap:10px;align-items:center;padding:5px 0;font-size:13px}
.hb-l{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb-t{position:relative;height:14px;background:#F1F2F4;border-radius:4px;display:block}
.hb-f{position:absolute;inset:0 auto 0 0;background:var(--up);border-radius:4px;opacity:.85}
.hb-f.over{background:var(--warn)}
.hb-m{position:absolute;top:-4px;bottom:-4px;border-left:2px dashed var(--brand)}
.hb-v{text-align:right;font-family:var(--num);font-weight:700;font-size:15px}
.hb-v.over{color:var(--warn)}
.hb-axis{padding:0}
.hb-axis .hb-t{height:14px}
.hb-cap{position:absolute;transform:translateX(-50%);font-size:11px;color:var(--brand);white-space:nowrap;top:0}
.wf{display:grid;grid-template-columns:64px 1fr 66px;gap:10px;align-items:center;height:26px;font-size:13px}
.wf-l{color:var(--ink2)}
.wf-v{text-align:right;font-family:var(--num);font-weight:600;color:var(--ink2)}
.wf.b .wf-l,.wf.b .wf-v{color:var(--ink);font-weight:700}
.wf-t{position:relative;height:100%;display:block}
.wf-z{position:absolute;top:0;bottom:0;border-left:1px solid var(--ink3)}
.wf-f{position:absolute;top:5px;bottom:5px;border-radius:3px}
.wf-f.s{background:var(--ink)}.wf-f.c{background:#E3B5B8}.wf-f.pos{background:var(--up)}.wf-f.neg{background:var(--down)}
.hb-std{font-size:11px;color:var(--brand);text-align:right;margin:-3px 0 4px;font-family:var(--txt)}
.ly-cap{margin-top:8px;color:var(--ink);font-weight:500}
.legend i.line.ly-line{border-top:2px dotted var(--ink2)}
.ly-box{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.ly-box h3{font-size:14px;margin:0 0 6px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ly-box h3 .note{font-size:12px;font-weight:400;color:var(--ink3)}
.lyr{display:grid;grid-template-columns:118px repeat(3,1fr);gap:10px;align-items:start;padding:8px 0;font-size:13px}
.lyr + .lyr{border-top:1px dashed var(--line)}
.lyr.lyh{padding:2px 0 6px;font-size:12px;color:var(--ink3);border-bottom:1px solid var(--line)}
.lyr.lyh span{text-align:right}
.lyr.lyh + .lyr{border-top:0}
.lyr.tot{border-top:1px solid var(--ink3)}
.lyr.tot .ly-l,.lyr.tot .lyv b{font-weight:700;color:var(--ink)}
.ly-l{color:var(--ink2);white-space:nowrap;padding-top:2px}
.lyv{text-align:right;font-family:var(--num);line-height:1.3}
.lyv b{font-weight:600;font-size:15px;margin-right:4px}
.lyv .chip{margin-top:0;font-size:11.5px;padding:0 6px}
.lyv small{display:block;font-size:11.5px;color:var(--ink3);white-space:nowrap}
@media (max-width:680px){.lyr{grid-template-columns:repeat(3,1fr);row-gap:4px}.ly-l{grid-column:1/-1}.lyr.lyh span:first-child{display:none}.lyv b{display:block;margin:0}}
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin:26px 2px 0}
.sec h2{font-size:18px;margin:0;display:flex;align-items:center;gap:8px}
.sec .tag{font-family:var(--num);font-size:13px;font-weight:600;color:var(--paper);background:var(--ink);border-radius:6px;padding:1px 8px}
.sec .note{font-size:12.5px;color:var(--ink2)}
.sec + .kpis,.sec + .card,.sec + .two{margin-top:10px}
.labgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.labgrid .lab-st{padding:0;border:0}
.labgrid .lab-st + .lab-st{border-left:1px solid var(--line);padding-left:14px;padding-top:0}
.cnum{font-family:var(--num);font-size:15px;color:var(--ink)}
.cnum.bad{color:var(--down)}
.cmp-note{font-size:12px;color:var(--ink3);margin:-4px 0 8px}
.cmpt{width:100%;min-width:480px;border-collapse:collapse;font-variant-numeric:tabular-nums}
.cmpt th,.cmpt td{padding:9px 8px;text-align:right;border-bottom:1px dashed var(--line);font-size:13.5px;white-space:nowrap}
.cmpt thead th{font-size:12.5px;font-weight:500;color:var(--ink2);border-bottom:1px solid var(--ink3);vertical-align:bottom}
.cmpt thead th small{display:block;color:var(--warn);font-size:11px;font-weight:500}
.cmpt tbody th{text-align:left;font-weight:500;color:var(--ink2)}
.cmpt td{font-family:var(--num);color:var(--ink2)}
.cmpt td b{color:var(--ink);font-size:15px}
.cmpt .chip{margin:0 0 0 4px;font-size:11.5px;padding:0 6px}
.cmpt tr.tot th,.cmpt tr.tot td{border-top:1px solid var(--ink3);border-bottom:0;font-weight:700;color:var(--ink)}
@media (max-width:680px){.labgrid{grid-template-columns:1fr}.labgrid .lab-st + .lab-st{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:10px}.sec{margin-top:22px}}
.knote{font-size:10.5px;line-height:1.35;color:var(--ink3);margin-top:4px}
.pnote{font-size:11.5px;line-height:1.5;color:var(--ink3);margin:-6px 0 10px}
.card.goal h2{flex-wrap:wrap}
.card.goal h2 > span:first-child{display:flex;align-items:center;gap:8px}
.card.goal .tag{font-family:var(--num);font-size:12.5px;font-weight:600;color:var(--paper);background:var(--ink);border-radius:6px;padding:1px 8px}
.cmp-box{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.cmp-box h3{font-size:14px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.cmp-box h3 .note{font-size:12px;font-weight:400;color:var(--ink3)}
.cstrip{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.cs{background:#F6F7F8;border-radius:10px;padding:10px 12px}
.cs-l{font-size:12.5px;color:var(--ink2)}
.cs-v{font-family:var(--num);font-weight:700;font-size:24px;line-height:1.2;margin:2px 0 6px}
.cs-ref{font-size:12px;color:var(--ink2);font-family:var(--num);padding:4px 0 2px;border-top:1px dashed var(--line)}
.cs-n{display:block;font-size:11.5px;color:var(--ink3)}
.cs-x{display:flex;justify-content:space-between;align-items:center;gap:6px}
.cs-x b{font-weight:600;font-size:13.5px;color:var(--ink)}
.cs-ref .chip{margin:0;font-size:11.5px;padding:0 6px}
.cs-ref em{font-style:normal;color:var(--warn);font-family:var(--txt);font-size:11.5px}
.cmp-more{margin-top:10px}
.cmp-more summary{cursor:pointer;font-size:13px;color:var(--ink2);padding:4px 0;list-style:revert}
.cmp-more-in{margin-top:8px}
.cmp-more-in .tog{margin-bottom:6px}
@media (max-width:680px){.cstrip{grid-template-columns:1fr;gap:8px}.cs-v{font-size:22px;margin:0 0 4px}}
.free{white-space:pre-wrap;font-size:15px;line-height:1.7;margin:0}
.free.empty{color:var(--ink3)}
.focus{border-left:4px solid var(--brand)}
.foot{text-align:center;font-size:12px;color:var(--ink3);margin-top:18px}
.err{background:#FDECEA;color:var(--down);padding:10px 14px;border-radius:10px;margin-top:14px;font-size:14px}

@media (max-width:680px){
  .kpis{grid-template-columns:1fr 1fr}
  .two{grid-template-columns:1fr}
  .two .card + .card{margin-top:0}
  .month{grid-template-columns:1fr}
  .ringbox{display:grid;grid-template-columns:96px 1fr;column-gap:14px;align-items:center;text-align:left}
  .ringbox svg{grid-row:1/span 2}
  .ringbox .cap{grid-column:2;margin-top:0}
  .ly-box h3{flex-direction:column;gap:0}
  .ringbox svg{width:96px}
  .date{font-size:34px}
  .card{padding:14px 16px 16px}
  .kpi .v{font-size:26px}
  .hb{grid-template-columns:116px 1fr 46px;font-size:12.5px;gap:8px}
}
@media print{body{background:#fff}select,.tog{display:none}}
</style>
</head>

/* ---------- 读 Google Sheet（gviz CSV） ---------- */
function parseCSV(text){
  const out=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===','){row.push(cur);cur='';}
    else if(c==='\n'){row.push(cur);out.push(row);row=[];cur='';}
    else if(c!=='\r') cur+=c;
  }
  if(cur!==''||row.length){row.push(cur);out.push(row);}
  return out;
}
async function fetchTab(tab){
  const url=`https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(tab)}`;
  const res=await fetch(url); if(!res.ok) throw new Error(`${tab}: HTTP ${res.status}`);
  const [head,...body]=parseCSV(await res.text());
  return body.filter(r=>r.some(v=>v!=='')).map(r=>Object.fromEntries(head.map((h,i)=>[h.trim(),r[i]??''])));
}
function toNum(v){
  if(typeof v==='number') return v;
  const s=String(v??'').trim(); if(s==='') return '';
  const neg=/^\(.*\)$/.test(s)||/^-/.test(s);
  const n=+s.replace(/[£$€,%()\s-]/g,'');
  return isNaN(n)?v:(neg?-n:n);
}
const TEXT_FIELDS=new Set(['date','日期','问题','今日重点','月份']);
function normRow(r){const o={};for(const k in r) o[k]=TEXT_FIELDS.has(k)?r[k]:toNum(r[k]);o.date=normDate(r.date||r['日期']);return o;}
function normDate(s){
  if(!s) return ''; s=String(s).trim();
  let m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/); if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return '';
}

  const [daily,profit,tg,txt,dims,bs,ad]=await Promise.all([fetchTab(t.daily),fetchTab(t.profit).catch(()=>[]),fetchTab(t.target).catch(()=>[]),fetchTab(t.text),fetchTab(t.dims),fetchTab(t.base).catch(()=>[]),fetchTab(t.adj).catch(()=>[])]);
  const cfg={text:Object.fromEntries(txt.filter(r=>r['键']).map(r=>[r['键'].trim(),r['内容']])),dims};
  const pBy=Object.fromEntries(profit.map(normRow).filter(r=>r.date).map(r=>[r.date,r]));
  const rows=daily.map(normRow).filter(r=>r.date).map(r=>({...pBy[r.date],...r}));
  const targets={}; tg.forEach(x=>{const m=String(x['月份']||'').slice(0,7); if(!m) return; const o={}; for(const k in x) o[k]=k==='月份'?x[k]:toNum(x[k]); targets[m]=o;});

  const adj={}; ad.forEach(x=>{const m=String(x['月份']||'').slice(0,7); if(!m) return; const o={}; for(const k in x) o[k]=(k==='月份'||k==='备注')?x[k]:toNum(x[k]); o.截至=normDate(x['截至日期']); if(o.截至) adj[m]=o;});

function chipAbs(cur,prev,lowerBetter=true){
  if(cur==null||prev==null) return `<span class="chip flat" title="${esc(T('无对比'))}">—</span>`;
  const d=cur-prev, cls=d===0?'flat':((lowerBetter?d<0:d>0)?'up':'down');
  return `<span class="chip ${cls}">${d>0?'▲':d<0?'▼':''}${Math.abs(d)}</span>`;
}
function chip(cur,prev,{lowerBetter=false}={}){
  if(cur==null||prev==null||prev===0) return `<span class="chip flat" title="${esc(T('无对比'))}">—</span>`;
  const d=(cur-prev)/Math.abs(prev)*100, good=lowerBetter?d<0:d>0;
  const cls=Math.abs(d)<0.05?'flat':(good?'up':'down');
  return `<span class="chip ${cls}">${d>0?'▲':d<0?'▼':''}${Math.abs(d).toFixed(1)}%</span>`;
}

// KPI 趋势：实心点 = 当天，空心圆 = 上周同日（涨跌对比的基准）
function kpiSpark(vals,color,cmpIdx){
  const W=200,H=44,p=5, pts=vals.map((v,i)=>[i,v]).filter(x=>x[1]!=null);
  if(pts.length<2) return '';
  const lo=Math.min(...pts.map(x=>x[1])), hi=Math.max(...pts.map(x=>x[1])), rg=(hi-lo)||1;
  const X=i=>p+i*(W-2*p)/(vals.length-1), Y=v=>H-p-(v-lo)/rg*(H-2*p);
  const d=pts.map((x,k)=>(k?'L':'M')+X(x[0]).toFixed(1)+' '+Y(x[1]).toFixed(1)).join('');
  const last=vals.length-1, lv=vals[last], cv=vals[cmpIdx];
  let g=`<path d="${d}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" opacity=".8"/>`;
  if(cv!=null) g+=`<circle cx="${X(cmpIdx)}" cy="${Y(cv)}" r="3.6" fill="var(--paper)" stroke="${color}" stroke-width="1.6"/>`;
  if(lv!=null) g+=`<circle cx="${X(last)}" cy="${Y(lv)}" r="3.8" fill="${color}"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:44px" aria-hidden="true">${g}</svg>`;
}

    if(v!=null){ const fill=d===sel?'var(--ink)':(pace&&v>=pace?'#9AA3AD':'var(--mute)');
      g+=`<rect x="${x}" y="${Y(v)}" width="${w}" height="${H-b-Y(v)}" rx="2" fill="${fill}"><title>${m}/${d}  ${money(v)}</title></rect>`; }
    if(d===1||(d%5===0&&Math.abs(d-sel)>1&&(bw>12||d%10===0))||d===sel) g+=`<text x="${x+w/2}" y="${H-3}" text-anchor="middle" font-size="11" fill="${d===sel?'var(--ink)':'var(--ink3)'}" font-weight="${d===sel?700:500}">${d}</text>`;
  });
  if(pace) g+=`<line x1="${l}" x2="${W}" y1="${Y(pace)}" y2="${Y(pace)}" stroke="var(--brand)" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img">${g}</svg>`;
}
function waterfall(r,view){
  const S=view==='ALL'?agg(r,sales):agg(r,sales,[view]);
  const items=COSTS.map(c=>({lab:c.name,v:stSum(r,c.key,view)})).filter(x=>x.v!=null);
  const P=stSum(r,'利润',view);
  if(S==null||!items.length) return `<p class="free empty">${esc(T('利润_无数据'))}</p>`;
  const lo=Math.min(0,P??0), hi=S, X=v=>(v-lo)/(hi-lo)*100, z=X(0);
  const row=(lab,a,b,cls,val,bold)=>`<div class="wf ${bold?'b':''}"><span class="wf-l">${esc(lab)}</span>
    <span class="wf-t"><span class="wf-z" style="left:${z}%"></span><span class="wf-f ${cls}" style="left:${Math.min(X(a),X(b))}%;width:max(${Math.abs(X(b)-X(a))}%,2px)"></span></span>
    <span class="wf-v">${val}</span></div>`;
  let run=S, h=row(T('利润_销售额'),0,S,'s',money(S),true);
  items.forEach(it=>{h+=row(it.lab,run-it.v,run,'c','-'+money(it.v)); run-=it.v;});
  h+=row(T('利润_利润'),0,P,P>=0?'pos':'neg',money(P),true);
  return `<div role="img">${h}</div>`;
}
function hbars(items,unit,maxV){
  const hi=Math.max(maxV,...items.map(i=>Math.max(i.v??0,i.t??0)))*1.05, pc=v=>Math.min(v/hi*100,100);
  return `<div class="hbars">${items.map(it=>{
    const over=it.v!=null&&it.t!=null&&it.v>it.t;
    return `<div class="hb"><span class="hb-l"><i class="dot" style="background:${it.color}"></i>${esc(it.lab)}</span>
      <span class="hb-t">${it.v!=null?`<span class="hb-f ${over?'over':''}" style="width:${pc(it.v)}%"></span>`:''}${it.t!=null?`<span class="hb-m" style="left:${pc(it.t)}%"></span>`:''}</span>
      <span class="hb-v ${over?'over':''}">${it.v==null?'—':fx(it.v)+unit}</span></div>
      ${it.t!=null?`<div class="hb-std">${esc(T('目标标签',{值:fx(it.t)+unit}))}</div>`:''}`;
  }).join('')}</div>`;
}

/* ---------- 月目标 / 去年同期 / 标准 ---------- */
const tgtOf=m=>num(DATA.targets[m]?.销售目标)??null;
const monthShift=(m,n)=>{const d=new Date(Date.UTC(+m.slice(0,4),+m.slice(5,7)-1+n,1));return d.toISOString().slice(0,7)};
const baseOf=(m,st,pf,kind)=>num(DATA.base?.[m]?.[`${st}_${pf}_${kind}`]);
const lyOf=(m,st,pf,kind)=>baseOf(monthShift(m,-12),st,pf,kind)??num(DATA.targets[m]?.[`去年_${st}_${pf}_${kind}`]);
// 月度补录：截至日期（含）之前的合计，只在查看截至日期之后的日子时生效
function lumpFor(dateStr){const a=DATA.adj?.[dateStr.slice(0,7)]; return a&&a.截至<dateStr?a:null;}
function lumpAgg(L,kind,sts=ST.map(s=>s.key),pfs=PF.map(p=>p.key)){if(!L) return 0; let t=0; sts.forEach(s=>pfs.forEach(p=>{t+=num(L[`${s}_${p}_${kind}`])??0})); return t;}
function baseTotal(m,kind){const v=[];ST.forEach(s=>PF.forEach(p=>v.push(baseOf(m,s.key,p.key,kind))));return v.every(x=>x==null)?null:sum(v);}
function lyTotal(m,kind){const v=[];ST.forEach(s=>PF.forEach(p=>v.push(lyOf(m,s.key,p.key,kind))));return v.every(x=>x==null)?null:sum(v);}
// 标准：当天没填就往前找最近一次填的；都没有就用「文案」里的默认值
function stdFor(dateStr,field,defKey){
  for(let i=ALL.length-1;i>=0;i--){const r=ALL[i]; if(r.date>dateStr) continue; const v=num(r[field]); if(v!=null) return v;}
  return TN(defKey);
}
const signPct=v=>v==null?'—':(v>=0?'+':'')+v.toFixed(1)+'%';

/* ---------- 渲染 ---------- */
let DATA, BYDATE, ALL=[], VIEW='ALL', CUR;
const DAYS=()=>TN('趋势天数')||14;
function series(dateStr,fn){const n=DAYS();return [...Array(n)].map((_,i)=>fn(BYDATE[shift(dateStr,i-n+1)]))}
function drawMonth(dateStr,target){const el=document.getElementById('mb'); if(el) el.innerHTML=monthBars(dateStr,target,Math.max(260,el.clientWidth));}
let _rt; addEventListener('resize',()=>{clearTimeout(_rt);_rt=setTimeout(()=>CUR&&drawMonth(CUR,tgtOf(CUR.slice(0,7))),150)});

function kpiCard(label,value,cur,prev,vals,{color='var(--ink)',neg=false,note=''}={},dateStr){
  const n=DAYS(), cmpDay=WDAY(new Date(shift(dateStr,-7)+'T00:00:00Z').getUTCDay());

}

// 同期参考值：优先「月度基准」全月 × 时间进度；没有就用那个月已录入的每日数据（1 号到同一天）
// 同期参考值：那个月有每日数据就用 1 号到同一天的实际累计；没有就用「月度基准」全月 × 天数比例估算
function periodRef(mk,sts,pfs,dayNum,_tf,legacy){
  const rows=DATA.rows.filter(x=>x.date.startsWith(mk)&&+x.date.slice(8,10)<=dayNum);
  if(rows.length){const S=sum(rows.map(x=>agg(x,sales,sts,pfs))),O=sum(rows.map(x=>agg(x,orders,sts,pfs)));return {S,O,A:O?S/O:null,est:false};}
  const v=[],o=[]; sts.forEach(s=>pfs.forEach(p=>{v.push(baseOf(mk,s,p,'销售额')??(legacy?num(legacy[`去年_${s}_${p}_销售额`]):null));o.push(baseOf(mk,s,p,'单量')??(legacy?num(legacy[`去年_${s}_${p}_单量`]):null));}));
  if(v.every(x=>x==null)) return null;
  const dimRef=new Date(Date.UTC(+mk.slice(0,4),+mk.slice(5,7),0)).getUTCDate(), f=Math.min(dayNum,dimRef)/dimRef;
  const S=sum(v),O=sum(o); return {S:S*f,O:O*f,A:O?S/O:null,est:true};
}
// 同期列标题：直接写日期段，例 8/1–8/27、2025 9/1–9/27
function refLabel(mk,dayNum,key){
  const dimRef=new Date(Date.UTC(+mk.slice(0,4),+mk.slice(5,7),0)).getUTCDate(), m=+mk.slice(5,7);
  return T(key,{年:mk.slice(0,4),月:m,日:Math.min(dayNum,dimRef)});
}
let CMPV='S';
function cmpTable(ctx){
  const {month,dateStr,tf,mtdAgg}=ctx, dayNum=+dateStr.slice(8,10);
  const pm=monthShift(month,-1), ly=monthShift(month,-12), legacy=DATA.targets[month];
  const fmt=CMPV==='S'?money:CMPV==='O'?int:money2;
  const pick=o=>o==null?null:(CMPV==='S'?o.S:CMPV==='O'?o.O:o.A);
  let anyPm=false, anyLy=false;
  const row=(st,pf)=>{
    const sts=st?[st.key]:ST.map(s=>s.key), pfs=pf?[pf.key]:PF.map(p=>p.key);
    const cur=mtdAgg(sts,pfs), a=periodRef(pm,sts,pfs,dayNum,tf), b=periodRef(ly,sts,pfs,dayNum,tf,legacy);
    if(a) anyPm=true; if(b) anyLy=true;
    const c=pick(cur), va=pick(a), vb=pick(b);
    const lab=st?`${st.short} ${pf.short}`:T('对比_合计');
    return `<tr class="${st?'':'tot'}"><th scope="row">${pf?`<i class="dot" style="background:${pf.color}"></i>`:''}${esc(lab)}</th>
      <td><b>${fmt(c)}</b></td>
      <td>${va==null?'—':`${fmt(va)} ${chip(c,va)}`}</td>
      <td>${vb==null?'—':`${fmt(vb)} ${chip(c,vb)}`}</td></tr>`;
  };
  const body=ST.map(st=>PF.map(pf=>row(st,pf)).join('')).join('')+row(null,null);
  const miss=(ok,mk)=>ok?'':`<small>${esc(T('对比_缺数据',{月:mk}))}</small>`;
  return `<div class="scroll"><table class="cmpt">
    <thead><tr><th></th><th>${esc(T('对比_本月'))} ${+month.slice(5,7)}/1–${+month.slice(5,7)}/${dayNum}</th><th>${esc(refLabel(pm,dayNum,'对比_上月'))}${miss(anyPm,pm)}</th><th>${esc(refLabel(ly,dayNum,'对比_去年'))}${miss(anyLy,ly)}</th></tr></thead>
    <tbody>${body}</tbody></table></div>`;
}

function cmpStrip(ctx){
  const {month,dateStr,tf,mtdAgg}=ctx, dayNum=+dateStr.slice(8,10);
  const pm=monthShift(month,-1), ly=monthShift(month,-12), legacy=DATA.targets[month];
  const all=[ST.map(s=>s.key),PF.map(p=>p.key)];
  const cur=mtdAgg(...all), a=periodRef(pm,...all,dayNum,tf), b=periodRef(ly,...all,dayNum,tf,legacy);
  const item=(label,k,fmt)=>{
    const line=(name,o,mk)=>o==null
      ?`<div class="cs-ref"><span class="cs-n">${esc(name)}</span><span class="cs-x"><em>${esc(T('对比_缺数据',{月:mk}))}</em></span></div>`
      :`<div class="cs-ref"><span class="cs-n">${esc(name)}${o.est?esc(T('对比_估算')):''}</span><span class="cs-x"><b>${fmt(o[k])}</b>${chip(cur[k],o[k])}</span></div>`;
    return `<div class="cs"><div class="cs-l">${esc(label)}</div><div class="cs-v">${fmt(cur[k])}</div>${line(refLabel(pm,dayNum,'对比_上月'),a,pm)}${line(refLabel(ly,dayNum,'对比_去年'),b,ly)}</div>`;
  };
  return `<div class="cstrip">${item(T('对比_销售额'),'S',money)}${item(T('对比_单量'),'O',int)}${item(T('对比_客单价'),'A',money2)}</div>`;
}

function render(dateStr){

  const profit=num(r?.利润), pprofit=num(p?.利润);
  const wd=i=>WDAY(new Date(i+'T00:00:00Z').getUTCDay());
  const mdTxt=ds=>`${+ds.slice(5,7)}/${+ds.slice(8,10)}`;

  // ---- 本月累计 ----
  const month=dateStr.slice(0,7);

  const mtd=DATA.rows.filter(x=>x.date.startsWith(month)&&x.date<=dateStr&&(!LUMP||x.date>LUMP.截至));
  const mtdAgg=(sts,pfs)=>{const S=sum(mtd.map(x=>agg(x,sales,sts,pfs)))+lumpAgg(LUMP,'销售额',sts,pfs), O=sum(mtd.map(x=>agg(x,orders,sts,pfs)))+lumpAgg(LUMP,'单量',sts,pfs); return {S,O,A:O?S/O:null};};

    DATA=await loadData();
    applyCfg(DATA.cfg);
    ALL=DATA.rows.slice().sort((a,b)=>a.date.localeCompare(b.date));
    DATA.rows=ALL.filter(r=>agg(r,orders)!=null);
    BYDATE=Object.fromEntries(DATA.rows.map(r=>[r.date,r]));
    if(!DATA.rows.length) throw new Error(CONFIG.TABS.daily+': 0');
    const h=location.hash.slice(1);
    render(BYDATE[h]?h:DATA.rows[DATA.rows.length-1].date);
  }catch(e){
    // 表读不到时文案也读不到，只显示技术信息
    document.getElementById('app').innerHTML=`<div class="err">${esc(e.message)}</div>`;
  }
})();
</script>
</body>
</html>
