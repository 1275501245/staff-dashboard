<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#D7261E">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suppliers</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #1a1a1a; padding-bottom: 40px; }

.header { background: #fff; border-bottom: 1px solid #efefef; padding: 16px 16px 14px; }
.header-top { display: flex; align-items: center; gap: 12px; }
.back { width: 30px; height: 30px; border-radius: 50%; background: #f5f5f5; border: none; display: flex; align-items: center; justify-content: center; font-size: 16px; color: #999; text-decoration: none; flex-shrink: 0; }
.header-title { font-size: 16px; font-weight: 600; }
.header-sub { font-size: 11px; color: #aaa; margin-top: 2px; }

.body { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.state-box { text-align: center; padding: 50px 20px; color: #aaa; font-size: 13px; }

.supp-card { background: #fff; border: 1px solid #efefef; border-radius: 14px; overflow: hidden; }
.supp-hdr { display: flex; align-items: center; gap: 10px; padding: 14px 16px; cursor: pointer; user-select: none; }
.supp-av { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; }
.supp-info { flex: 1; min-width: 0; }
.supp-name { font-size: 15px; font-weight: 600; }
.supp-tagline { font-size: 11px; color: #aaa; margin-top: 2px; }
.chev { font-size: 11px; color: #ccc; transition: transform 0.2s; }
.supp-card.open .chev { transform: rotate(180deg); }

.supp-detail { display: none; border-top: 1px solid #f5f5f5; }
.supp-card.open .supp-detail { display: block; }

.info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: #f5f5f5; }
.info-cell { background: #fff; padding: 10px 14px; }
.info-label { font-size: 10px; color: #bbb; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 3px; }
.info-val { font-size: 13px; font-weight: 500; color: #1a1a1a; word-break: break-all; }

.sched-section { border-top: 1px solid #f5f5f5; }
.section-header { padding: 10px 14px 6px; font-size: 10px; color: #bbb; text-transform: uppercase; letter-spacing: 0.04em; }
.sched-group { padding: 9px 14px 11px; border-top: 1px solid #f5f5f5; }
.sched-group:first-of-type { border-top: none; }
.sched-sites { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
.sched-site-name { font-size: 13px; font-weight: 600; color: #1a1a1a; flex: 1; }
.sched-freq { font-size: 10px; font-weight: 600; color: #6b7fd6; background: #eef2ff; border-radius: 20px; padding: 3px 9px; white-space: nowrap; }
.sched-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { display: flex; align-items: center; gap: 5px; background: #f8f8f8; border: 1px solid #f0f0f0; border-radius: 8px; padding: 5px 9px; }
.chip-label { font-size: 9px; color: #bbb; text-transform: uppercase; letter-spacing: 0.04em; }
.chip-val { font-size: 12px; font-weight: 600; color: #1a1a1a; }
.chip.stocktake .chip-val { color: #1a8f5f; }
.chip.order .chip-val { color: #d97706; }
.sched-note { font-size: 11px; color: #bbb; margin-top: 6px; }

.prod-section { border-top: 1px solid #f5f5f5; }
.prod-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; border-top: 1px solid #f5f5f5; }
.prod-row:first-of-type { border-top: none; }
.prod-name { font-size: 13px; font-weight: 600; color: #2A1A16; line-height: 1.3; min-width: 0; }
.prod-unit { flex-shrink: 0; font-size: 11px; color: #9A8580; background: #FBF6F0; border-radius: 999px; padding: 3px 9px; white-space: nowrap; }
.no-products { padding: 14px; text-align: center; font-size: 12px; color: #ccc; }
.supp-name .cn { color: #9A8580; font-weight: 500; margin-left: 4px; }
.prod-name .cn { display: block; color: #9A8580; font-weight: 400; font-size: 12px; margin-top: 2px; }
</style>
<link rel="stylesheet" href="/assets/hdl.css">
<link rel="stylesheet" href="/assets/order-panel.css">
<style id="hdl-override">
.body, .site-bar, .date-row, .filter-row { max-width: 760px; margin-left: auto !important; margin-right: auto !important; }
.header-top, .header > *:not(.header-top) { max-width: 760px; margin-left: auto; margin-right: auto; }
/* ── HDL theme: family B (header/header-top/back) ── */
* { -webkit-tap-highlight-color: transparent; }
body { background: var(--cream) !important; color: var(--ink) !important; }
.header { position: sticky; top: 0; z-index: 100; background: linear-gradient(150deg, #E8342B 0%, var(--red) 55%, var(--red-deep) 100%) !important; color: #fff; border-bottom: none !important; padding: 10px 14px !important; box-shadow: 0 4px 16px rgba(168,21,15,.16); }
.header-top { gap: 10px !important; }
.header-top::after { content: ''; width: 28px; height: 28px; background: url(/assets/hi-mark-white.png) center/contain no-repeat; margin-left: auto; flex-shrink: 0; }
.back { background: rgba(255,255,255,.16) !important; color: #fff !important; }
.header-title { color: #fff; font-weight: 700 !important; }
.header-sub { color: rgba(255,255,255,.82) !important; }
.state-box { color: var(--muted) !important; }
.state-icon { display: none !important; }
.supp-card, .item-card, .clear-section { border: none !important; box-shadow: var(--shadow); border-radius: 14px !important; }
.supp-label, .section-label, .section-header, .bar-label { color: var(--muted) !important; }
.toast { background: var(--ink) !important; }

.info-grid { background: var(--line-soft) !important; }
.sched-freq { color: var(--red) !important; background: var(--red-soft) !important; }
.chip { background: var(--cream) !important; border: none !important; }
.chip.stocktake .chip-val { color: var(--green) !important; }
.chip.order .chip-val { color: var(--amber) !important; }
.supp-detail, .sched-section, .prod-section, .sched-group, .prod-row { border-color: var(--line-soft) !important; }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <a class="back" href="/home">←</a>
    <div>
      <div class="header-title">Suppliers 供应商</div>
      <div class="header-sub" id="hdr-sub">Loading…</div>
    </div>
  </div>
</div>

<div class="body" id="body">
  <div class="state-box">Loading suppliers…</div>
</div>

<script src="/assets/order-panel.js"></script>
<script>
const SHEET_ID = '189O3dYKEwvR1zMxBs--eVM8VpK_w2AEV6IzUJ-JoAmc';
const AV_COLORS = [
  {bg:'#eef2ff',text:'#4a6cf7'},{bg:'#fef3eb',text:'#e05c2a'},
  {bg:'#ecfdf5',text:'#0f9d6e'},{bg:'#f5f3ff',text:'#9333ea'},
  {bg:'#fffbeb',text:'#d97706'},{bg:'#ecfeff',text:'#0891b2'},
];

function toggleCard(card) { card.classList.toggle('open'); }

async function fetchSheet(name) {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(name)}&headers=1`;
  const res = await fetch(url);
  const text = await res.text();
  const json = JSON.parse(text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/)[1]);
  if (!json.table?.rows?.length) return [];
  const cols = json.table.cols.map(c => c.label);
  return json.table.rows.map(r => {
    const obj = {};
    cols.forEach((col, i) => { obj[col] = r.c[i]?.v ?? r.c[i]?.f ?? ''; });
    return obj;
  });
}

// Group a supplier's schedule rows: sites sharing identical rules collapse into one line.
function groupSchedule(rows, allSiteCount) {
  const groups = [];
  rows.forEach(r => {
    const sig = [r.StocktakeDay, r.OrderDay, r.LeadTime, r.DeliveryDay, r.OrderFrequency, r.Notes].map(v => String(v || '').trim()).join('|');
    let g = groups.find(x => x.sig === sig);
    if (!g) { g = { sig, sites: [], row: r }; groups.push(g); }
    g.sites.push(r.Site);
  });
  groups.forEach(g => {
    g.label = (g.sites.length === allSiteCount) ? 'All sites 全部站点' : g.sites.join(', ');
  });
  return groups;
}

function chip(cls, label, val) {
  if (!val) return '';
  return `<div class="chip ${cls}"><span class="chip-label">${label}</span><span class="chip-val">${val}</span></div>`;
}

async function init() {
  let suppliers, schedule, products;
  try {
    let supplierSites, sites, stocktake;
    [suppliers, schedule, products, supplierSites, sites, stocktake] = await Promise.all([
      fetchSheet('Suppliers'), fetchSheet('SupplierSchedule'), fetchSheet('Products'),
      fetchSheet('SupplierSites').catch(() => []), fetchSheet('Sites').catch(() => []), fetchSheet('Stocktake').catch(() => [])
    ]);
    HDL_ORDER.init({ suppliers, schedule, products, supplierSites, sites, stocktake });
  } catch(e) {
    document.getElementById('body').innerHTML = `<div class="state-box">Failed to load. Check Sheet sharing settings.</div>`;
    return;
  }

  document.getElementById('hdr-sub').textContent = `${suppliers.length} suppliers · ${suppliers.length} 家供应商`;

  const allSites = [...new Set(schedule.map(r => r.Site).filter(Boolean))];

  const prodBySupp = {};
  products.forEach(p => {
    const s = p['SupplierName'];
    if (!prodBySupp[s]) prodBySupp[s] = [];
    prodBySupp[s].push(p);
  });

  const schedBySupp = {};
  schedule.forEach(r => {
    const s = r['SupplierName'];
    if (!s) return;
    if (!schedBySupp[s]) schedBySupp[s] = [];
    schedBySupp[s].push(r);
  });

  document.getElementById('body').innerHTML = suppliers.map((s, idx) => {
    const name = s['SupplierName'] || '—';
    const nameCN = s['SupplierCN'] || '';
    const initials = name.split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
    const col = AV_COLORS[idx % AV_COLORS.length];
    const prods = prodBySupp[name] || [];
    const cutoff = s['OrderCutoffTime'] || '—';
    const minOrder = s['MinOrderAmount'] || '—';
    const email = s['InvoiceEmail'] || '—';
    const notes = s['Notes'] || '';

    const groups = groupSchedule(schedBySupp[name] || [], allSites.length);
    const freqSet = [...new Set(groups.map(g => g.row.OrderFrequency).filter(Boolean))];
    const tagline = `${freqSet.join(' / ') || '—'} · ${prods.length} products 个产品`;

    const schedHtml = groups.length ? groups.map(g => {
      const r = g.row;
      const delivery = r.DeliveryDay || (r.LeadTime ? `Lead ${r.LeadTime}` : '');
      return `<div class="sched-group">
        <div class="sched-sites">
          <div class="sched-site-name">${g.label}</div>
          ${r.OrderFrequency ? `<div class="sched-freq">${r.OrderFrequency}</div>` : ''}
        </div>
        <div class="sched-chips">
          ${chip('stocktake', 'Stocktake 盘点', r.StocktakeDay)}
          ${chip('order', 'Order 开货', r.OrderDay)}
          ${chip('delivery', 'Delivery 送货', delivery)}
        </div>
        ${r.Notes ? `<div class="sched-note">${r.Notes}</div>` : ''}
      </div>`;
    }).join('') : `<div class="no-products">No schedule 未设置</div>`;

    return `<div class="supp-card" onclick="toggleCard(this)">
      <div class="supp-hdr">
        <div class="supp-av" style="background:${col.bg};color:${col.text}">${initials}</div>
        <div class="supp-info">
          <div class="supp-name">${name}${nameCN ? ` <span class="cn">${nameCN}</span>` : ''}</div>
          <div class="supp-tagline">${tagline}</div>
        </div>
        <div class="chev">▼</div>
      </div>
      <div class="supp-detail" onclick="event.stopPropagation()">
        <button class="order-btn" onclick="HDL_ORDER.open(${JSON.stringify(name).replace(/"/g, '&quot;')})">Order 开货 ›</button>
        <div class="info-grid">
          <div class="info-cell"><div class="info-label">Order cutoff 截单</div><div class="info-val">${cutoff}</div></div>
          <div class="info-cell"><div class="info-label">Min order 起送</div><div class="info-val">${minOrder}</div></div>
          <div class="info-cell"><div class="info-label">Invoice email 发票邮箱</div><div class="info-val">${email}</div></div>
          <div class="info-cell"><div class="info-label">Notes 备注</div><div class="info-val">${notes || '—'}</div></div>
        </div>
        <div class="sched-section">
          <div class="section-header">Schedule by site 各站安排</div>
          ${schedHtml}
        </div>
        <div class="prod-section">
          <div class="section-header">Products 产品</div>
          ${prods.length ? prods.map(p => `
            <div class="prod-row">
              <div class="prod-name">${p['NameEN'] || p['MyName'] || '—'}${p['NameCN'] ? `<span class="cn">${p['NameCN']}</span>` : ''}</div>
              <div class="prod-unit">${p['Unit'] || ''}</div>
            </div>`).join('') : `<div class="no-products">No products 暂无产品</div>`}
        </div>
      </div>
    </div>`;
  }).join('');
}

init();
</script>
</body>
</html>
